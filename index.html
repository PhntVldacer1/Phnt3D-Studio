// --- Drag logic for gizmo ---
window.addEventListener('mousedown', (e) => {
  // Allow drag when either Move OR Scale mode is active
  if (!(moveGizmoEnabled || scaleModeEnabled) || !moveGizmo) return;
  // --- Prevent move if Shift is held ---
  if (e.shiftKey) return;
  // --- Prevent drag if nothing is selected ---
  if (!selectedShapes || selectedShapes.length === 0) {
    const moveIndicatorBox = document.getElementById('move-indicator-box');
    if (moveIndicatorBox) moveIndicatorBox.style.display = 'none';
    return;
  }
  const rect = canvas.getBoundingClientRect();
  const mouse = new THREE.Vector2(
    ((e.clientX - rect.left) / rect.width) * 2 - 1,
    -((e.clientY - rect.top) / rect.height) * 2 + 1
  );
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(mouse, camera);
  // Flatten all meshes in moveGizmo for raycasting
  const gizmoMeshes = [];
  moveGizmo.children.forEach(arrow => {
    arrow.traverse(obj => {
      if (obj.isMesh) gizmoMeshes.push(obj);
    });
  });
  const intersects = raycaster.intersectObjects(gizmoMeshes, false);
  if (intersects.length > 0) {
    draggingAxis = intersects[0].object.userData.axis;
    dragStartMouse = { x: e.clientX, y: e.clientY };
    dragStartPositions = selectedShapes.map(g => g.position.clone());
    // If scale mode, capture start scales & offsets
    if (scaleModeEnabled) {
      dragStartScales = selectedShapes.map(g => g.scale.clone());
      // compute center and per-shape offset from center
      dragStartCenter = new THREE.Vector3();
      selectedShapes.forEach(g => dragStartCenter.add(g.position));
      dragStartCenter.divideScalar(selectedShapes.length);
      dragStartOffsets = selectedShapes.map(g => g.position.clone().sub(dragStartCenter));
      // compute average half-extent along axis to derive scale factor reference
      const axisNormLocal = (draggingAxis === 'x') ? new THREE.Vector3(1,0,0) :
                            (draggingAxis === 'y') ? new THREE.Vector3(0,1,0) : new THREE.Vector3(0,0,1);
      axisNormLocal.applyQuaternion(moveGizmo.quaternion).normalize();
      let sumAbs = 0;
      dragStartOffsets.forEach(off => sumAbs += Math.abs(off.dot(axisNormLocal)));
      dragInitialHalfExtent = (sumAbs / Math.max(1, dragStartOffsets.length));
      if (dragInitialHalfExtent < 1e-4) dragInitialHalfExtent = 1; // fallback
    }
    isMovingWithGizmo = true;
    mouseDownPos = null;
    boxSelecting = false;
    mouseMovedForBox = false;

    // --- STORE AXIS ORIGIN AND DIRECTION IN WORLD SPACE ---
    gizmoAxisOrigin = moveGizmo.position.clone();
    gizmoAxisDir = new THREE.Vector3();
    if (draggingAxis === 'x') gizmoAxisDir.set(1, 0, 0);
   
    if (draggingAxis === 'y') gizmoAxisDir.set(0, 1, 0);
    if (draggingAxis === 'z') gizmoAxisDir.set(0, 0, 1);



    gizmoAxisDir.applyQuaternion(moveGizmo.quaternion);

    // --- FIND CLOSEST POINT ON AXIS TO MOUSE RAY (INITIAL GRAB POINT) ---
    const mouseRay = raycaster.ray;
    gizmoAxisStartPoint = closestPointOnAxisToRay(
      gizmoAxisOrigin,

      gizmoAxisDir,
      mouseRay.origin,
      mouseRay.direction
    );
    e.preventDefault();

    // --- SHOW MOVE INDICATOR BOX ---
    const moveIndicatorBox = document.getElementById('move-indicator-box');
    moveIndicatorBox.style.display = 'block';
    moveIndicatorBox.textContent = '0.00';
    // Position it at the gizmo origin (screen space)
    const screenPos = worldToScreen(moveGizmo.position, camera, canvas);
    moveIndicatorBox.style.left = (screenPos.x - moveIndicatorBox.offsetWidth / 2) + 'px';
    moveIndicatorBox.style.top = (screenPos.y - moveIndicatorBox.offsetHeight / 2) + 'px';
  }
});

// --- Drag logic for gizmo ---
window.addEventListener('mousemove', (e) => {
  // Allow drag processing when either Move OR Scale mode is active
  if (!moveGizmo || !draggingAxis || !(moveGizmoEnabled || scaleModeEnabled)) return;
  // --- Prevent drag if nothing is selected ---
  if (!selectedShapes || selectedShapes.length === 0) {
    const moveIndicatorBox = document.getElementById('move-indicator-box');
    if (moveIndicatorBox) moveIndicatorBox.style.display = 'none';
    return;
  }
  const rect = canvas.getBoundingClientRect();
  // Get axis direction in world space
  let axisDir = new THREE.Vector3();
  if (draggingAxis === 'x') axisDir.set(1, 0, 0);
  if (draggingAxis === 'y') axisDir.set(0, 1, 0);
  if (draggingAxis === 'z') axisDir.set(0, 0, 1);
  axisDir.applyQuaternion(moveGizmo.quaternion);

  // --- FIND NEW CLOSEST POINT ON AXIS TO MOUSE RAY ---
  const mouse = new THREE.Vector2(
    ((e.clientX - rect.left) / rect.width) * 2 - 1,
    -((e.clientY - rect.top) / rect.height) * 2 + 1
  );
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(mouse, camera);
  const mouseRay = raycaster.ray;
  const axisOrigin = moveGizmo.position.clone();
  const axisPointNow = closestPointOnAxisToRay(
    axisOrigin,
    axisDir,
    mouseRay.origin,
    mouseRay.direction
  );

  // --- COMPUTE MOVEMENT ALONG AXIS ---
  let moveAmount = 0;
  if (gizmoAxisStartPoint) {
    moveAmount = axisPointNow.clone().sub(gizmoAxisStartPoint).dot(axisDir.clone().normalize());
  }

  // --- SNAP LOGIC ---
  const snapActive = e.shiftKey;
  if (snapActive) {
    // Snap the moveAmount for both Move and Scale modes to 0.10 units
    const snapStep = 0.10;
    moveAmount = Math.round(moveAmount / snapStep) * snapStep;
  }

  if (scaleModeEnabled) {
    // SCALE MODE: scale selectedShapes along the dragged axis around selection center
    const axisNorm = axisDir.clone().normalize();
    // Compute scale factor relative to initial half-extent
    const factor = 1 + (moveAmount / Math.max(1e-4, dragInitialHalfExtent));
    const scaleFactor = Math.max(0, factor);
    selectedShapes.forEach((g, i) => {
      // start perpendicular + axis component separation
      const startOffset = dragStartOffsets[i].clone();
      const axisComp = axisNorm.clone().multiplyScalar(startOffset.dot(axisNorm));
      const perp = startOffset.clone().sub(axisComp);
      const newAxisComp = axisComp.clone().multiplyScalar(scaleFactor);
      const newOffset = perp.add(newAxisComp);
      g.position.copy(dragStartCenter.clone().add(newOffset));
      // scale only along the active axis
      const startScale = dragStartScales[i];
      if (draggingAxis === 'x') {
        g.scale.set(startScale.x * scaleFactor, startScale.y, startScale.z);
      } else if (draggingAxis === 'y') {
        g.scale.set(startScale.x, startScale.y * scaleFactor, startScale.z);
      } else {
        g.scale.set(startScale.x, startScale.y, startScale.z * scaleFactor);
      }
    });

    // Update gizmo position to selection center
    let center = new THREE.Vector3();
    selectedShapes.forEach(shape => center.add(shape.position));
    center.divideScalar(selectedShapes.length);
    moveGizmo.position.copy(center);

    // Update indicator box for scale (show multiplier)
    const moveIndicatorBox = document.getElementById('move-indicator-box');
    if (isMovingWithGizmo && moveIndicatorBox) {
      // show scale multiplier with two decimals
      moveIndicatorBox.textContent = scaleFactor.toFixed(2) + (snapActive ? ' (SNAP)' : '');
      moveIndicatorBox.style.borderColor = snapActive ? '#39ff14' : '#444';
      const screenPos = worldToScreen(moveGizmo.position, camera, canvas);
      moveIndicatorBox.style.left = (screenPos.x - moveIndicatorBox.offsetWidth / 2) + 'px';
      moveIndicatorBox.style.top = (screenPos.y - moveIndicatorBox.offsetHeight / 2) + 'px';
    }
  } else {
    // MOVE MODE: existing translation behavior
    selectedShapes.forEach((g, i) => {
      let pos = dragStartPositions[i].clone();
      pos.add(axisDir.clone().normalize().multiplyScalar(moveAmount));
      g.position.copy(pos);
    });

    // Move gizmo itself
    let center = new THREE.Vector3();
    selectedShapes.forEach(g => center.add(g.position));
    center.divideScalar(selectedShapes.length);
    moveGizmo.position.copy(center);

    // --- UPDATE MOVE INDICATOR BOX ---
    const moveIndicatorBox = document.getElementById('move-indicator-box');
    if (isMovingWithGizmo && moveIndicatorBox) {
      // Show absolute value, max 2. decimals, never negative
      moveIndicatorBox.textContent = Math.abs(moveAmount).toFixed(2) + (snapActive ? ' (SNAP)' : '');
      // Outline LIME when snap is active, otherwise default gray
      moveIndicatorBox.style.borderColor = snapActive ? '#39ff14' : '#444';
      // Position it at the gizmo origin (screen space)
      const screenPos = worldToScreen(moveGizmo.position, camera, canvas);
      moveIndicatorBox.style.left = (screenPos.x - moveIndicatorBox.offsetWidth / 2) + 'px';
      moveIndicatorBox.style.top = (screenPos.y - moveIndicatorBox.offsetHeight / 2) + 'px';
    }
  }
});

// --- Helper: Closest point on axis to ray ---
function closestPointOnAxisToRay(axisOrigin, axisDir, rayOrigin, rayDir) {
  // See: https://math.stackexchange.com/a/1036959
  const p1 = axisOrigin, d1 = axisDir.clone().normalize();
  const p2 = rayOrigin, d2 = rayDir.clone().normalize();
  const w0 = p1.clone().sub(p2);
  const a = d1.dot(d1);
  const b = d1.dot(d2);
  const c = d2.dot(d2);
  const d = d1.dot(w0);
  const e = d2.dot(w0);
  const denom = a * c - b * b;
  if (Math.abs(denom) < 1e-6) return p1.clone(); // Parallel, just return axis origin
  const t = (b * e - c * d) / denom;
  return p1.clone().add(d1.clone().multiplyScalar(t));
}

// --- Helper: Project world position to screen ---
function worldToScreen(pos, camera, canvas) {
  const vector = pos.clone().project(camera);
  const rect = canvas.getBoundingClientRect();
  return {
    x: rect.left + (vector.x + 1) / 2 * rect.width,
    y: rect.top + (-vector.y + 1) / 2 * rect.height
  };
}

      hoveredGizmoAxis = cone.userData.axis;

     } else {

// --- ROTATE GIZMO LOGIC ---
let rotateGizmo = null;
let rotateGizmoEnabled = false;
let draggingRotationAxis = null;
let rotationStartAngle = 0;
let rotationStartQuaternion = new THREE.Quaternion();

function createRotateGizmo() {
  if (rotateGizmo) {
    scene.remove(rotateGizmo);
  }
  if (!rotateGizmoEnabled || selectedShapes.length === 0) return;

  rotateGizmo = new THREE.Group();

  const radius = 1.2;
  const tubeWidth = 0.03;
  const segments = 64;

  // Store base radius so we can scale the gizmo to keep a constant screen size
  rotateGizmo.userData.baseRadius = radius;

  const axes = [
    { axis: 'x', color: 0xb24747 }, // red
    { axis: 'y', color: 0x42ac6e }, // green
    { axis: 'z', color: 0x215db2 }  // blue
  ];

  axes.forEach(({ axis, color }) => {
    const torusGeometry = new THREE.TorusGeometry(radius, tubeWidth, 16, segments);
    const material = new THREE.MeshBasicMaterial({ 
      color: color,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.85,
      depthTest: false     // Add this line
    });
    const ring = new THREE.Mesh(torusGeometry, material);
    ring.userData.axis = axis;
    ring.renderOrder = 999;  // Add this line

    // Set correct orientation for each axis
    if (axis === 'x') {
      ring.rotateY(Math.PI / 2);
    } else if (axis === 'y') {
      ring.rotateX(Math.PI / 2);
    }
    // Z axis is already correctly oriented

    rotateGizmo.add(ring);
  });
  
  // Position at selection center and match rotation
  let center = new THREE.Vector3();
  let combinedRotation = new THREE.Quaternion();
  
  selectedShapes.forEach((shape, index) => {
    center.add(shape.position);
    if (index === 0) {
      combinedRotation.copy(shape.quaternion);
    }
  });
  
  center.divideScalar(selectedShapes.length);
  rotateGizmo.position.copy(center);
  rotateGizmo.quaternion.copy(combinedRotation);

  scene.add(rotateGizmo);
  updateRotateGizmoAxisVisibility();
}

function updateRotateGizmoAxisVisibility() {
  if (!rotateGizmo) return;
  // In ortho views show only the ring that corresponds to the view axis (e.g. X view -> show X ring only).
  if (usingOrtho && currentOrthoType) {
    rotateGizmo.children.forEach(ring => {
      const axis = ring.userData.axis;
      ring.visible = (axis === currentOrthoType);
    });
  } else {
    // In perspective / normal view show all rings
    rotateGizmo.children.forEach(ring => {
      ring.visible = true;
    });
  }
}

function updateRotateGizmoVisibility() {
  if (rotateGizmo) {
    scene.remove(rotateGizmo);
    // Null out the reference to avoid stale raycasts against a removed gizmo
    rotateGizmo = null;
  }
  if (rotateGizmoEnabled && selectedShapes.length > 0) {
    createRotateGizmo();
  }
}

// Replace the existing rotate gizmo mousemove handler with this improved version:

let rotateStartPoint = null;
let rotateCenter = new THREE.Vector3();
let worldRotationAxis = new THREE.Vector3();
let rotateStartVector = new THREE.Vector3();

// NEW: cumulative angle state so rotation can go beyond 180°

window.addEventListener('mousedown', (e) => {
  // Guard against stale or disabled rotate gizmo: require it to exist and at least one selected shape
  if (!rotateGizmoEnabled || !rotateGizmo || selectedShapes.length === 0) return;
  if (e.shiftKey) return;

  );

  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(mouse, camera);

  // Only raycast against VISIBLE rings
  const visibleRings = rotateGizmo.children.filter(ring => ring.visible);
  const intersects = raycaster.intersectObjects(visibleRings, false);
  
  if (intersects.length > 0) {
    const ring = intersects[0].object;
    draggingRotationAxis = ring.userData.axis;
    
    // Keep the highlight on the dragged ring
    let baseColor;
    if (ring.userData.axis === 'x') baseColor = 0xb24747;
    else if (ring.userData.axis === 'y') baseColor = 0x42ac6e;

    ring.material.needsUpdate = true;

    // mark that a rotate-gizmo drag is active so other handlers can block navigation
    isDraggingRotateGizmo = true;

    // Rest of the existing mousedown logic...
    rotateCenter.copy(rotateGizmo.position);
    
    if (draggingRotationAxis === 'x') worldRotationAxis.set(1, 0, 0);
    else if (draggingRotationAxis === 'y') worldRotationAxis.set(0, 1, 0);
    else worldRotationAxis.set(0, 0, 1);
    worldRotationAxis.applyQuaternion(rotateGizmo.quaternion);
    worldRotationAxis.normalize();

    const rotationPlane = new THREE.Plane();
    rotationPlane.setFromNormalAndCoplanarPoint(worldRotationAxis, rotateCenter);
    
    rotateStartPoint = new THREE.Vector3();
    raycaster.ray.intersectPlane(rotationPlane, rotateStartPoint);
    
    rotateStartVector.copy(rotateStartPoint).sub(rotateCenter);
    rotateStartVector.projectOnPlane(worldRotationAxis).normalize();

    // Initialize cumulative state so we can accumulate signed deltas per-move
    rotateCumulativeAngle = 0;
    rotateLastVector.copy(rotateStartVector);

    selectedShapes.forEach(shape => {
      shape.userData.startRotation = shape.quaternion.clone();
      shape.userData.startPosition = shape.position.clone();
    });

    // Show rotate indicator box

    if (rotateIndicatorBox) {

window.addEventListener('mousemove', (e) => {
  if (!rotateGizmoEnabled || !rotateGizmo || !draggingRotationAxis || !rotateStartPoint) return;

  const rect = canvas.getBoundingClientRect();
  const mouse = new THREE.Vector2(
    ((e.clientX - rect.left) / rect.width) * 2 - 1,
    -((e.clientY - rect.top) / rect.height) * 2 + 1
  );

  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(mouse, camera);

  // Project current mouse position onto rotation plane
  const rotationPlane = new THREE.Plane();
  rotationPlane.setFromNormalAndCoplanarPoint(worldRotationAxis, rotateCenter);
  
  const currentPoint = new THREE.Vector3();
  if (!raycaster.ray.intersectPlane(rotationPlane, currentPoint)) return;

  // Calculate current vector from center and project to plane
  const currentVector = currentPoint.clone().sub(rotateCenter);
  currentVector.projectOnPlane(worldRotationAxis).normalize();

  // Compute signed delta angle between last vector and current vector using atan2
  // angleDelta = atan2( dot(cross(last, current), axis), dot(last, current) )
  const dotLC = Math.min(1, Math.max(-1, rotateLastVector.dot(currentVector)));
  const crossLC = rotateLastVector.clone().cross(currentVector);
  const signed = crossLC.dot(worldRotationAxis);
  const angleDelta = Math.atan2(signed, dotLC);

  // Accumulate
  rotateCumulativeAngle += angleDelta;
  rotateLastVector.copy(currentVector);

  // Snap logic (like move tool): hold Shift to snap to 5 degrees
  const snapActive = e.shiftKey;
  let appliedAngle = rotateCumulativeAngle;
  if (snapActive) {
    const snap = Math.PI / 36; // 5 degrees in radians
    appliedAngle = Math.round(appliedAngle / snap) * snap;
  }

  // Apply rotation to each selected shape based on cumulative angle
  selectedShapes.forEach(shape => {
    // Create rotation quaternion
    const rotationQuat = new THREE.Quaternion();
    rotationQuat.setFromAxisAngle(worldRotationAxis, appliedAngle);

    // Reset to start state
    shape.position.copy(shape.userData.startPosition);
    shape.quaternion.copy(shape.userData.startRotation);

    // Rotate around center point
    const localPoint = shape.position.clone().sub(rotateCenter);
    localPoint.applyQuaternion(rotationQuat);
    shape.position.copy(rotateCenter).add(localPoint);
    
    // Apply rotation to shape
    shape.quaternion.premultiply(rotationQuat);
  });

  // Apply rotation to gizmo as well (match first selected)
  if (selectedShapes[0]) rotateGizmo.quaternion.copy(selectedShapes[0].quaternion);

  // Update gizmo position to match selection center
  let center = new THREE.Vector3();
  selectedShapes.forEach(shape => {
    center.add(shape.position);
  });
  center.divideScalar(selectedShapes.length);
  rotateGizmo.position.copy(center);

  // Update rotate indicator (degrees) — show total accumulated degrees (can exceed 360)
  const rotateIndicatorBox = document.getElementById('rotate-indicator-box');
  if (rotateIndicatorBox) {
    const deg = appliedAngle * 180 / Math.PI;
    // When snapping, show integer degrees (no .0). Otherwise show one decimal place.
    const degText = snapActive ? Math.abs(deg).toFixed(0) : Math.abs(deg).toFixed(1);
    rotateIndicatorBox.textContent = degText + '°' + (snapActive ? ' (SNAP)' : '');
    // Change outline to LIME when snap is active, otherwise default gray
    rotateIndicatorBox.style.borderColor = snapActive ? '#39ff14' : '#444';
    const screenPos = worldToScreen(rotateGizmo.position, camera, canvas);
    rotateIndicatorBox.style.left = (screenPos.x - rotateIndicatorBox.offsetWidth / 2) + 'px';
    rotateIndicatorBox.style.top = (screenPos.y - rotateIndicatorBox.offsetHeight / 2) + 'px';
  }
});

window.addEventListener('mouseup', () => {
  if (draggingRotationAxis && rotateGizmo) {
    // Reset all ring colors
    rotateGizmo.children.forEach(ring => {
      let baseColor;
      if (ring.userData.axis === 'x') baseColor = 0xb24747;
      else if (ring.userData.axis === 'y') baseColor = 0x42ac6e;
      else baseColor = 0x215db2;
      ring.material.color.setHex(baseColor);
      ring.material.opacity = 0.85;
      ring.material.needsUpdate = true;
    });

    // Record rotation for undo/redo
    // Use the shapes' current quaternions (after rotation) and ensure we capture the correct "old" state
    const rotationAction = {
      type: ActionType.ROTATE,
      shapes: selectedShapes.map(shape => {
        // oldRotation should be the rotation stored at drag start (before this rotation was applied)
        // newRotation should be the current rotation after this drag ended
        return {
          shape: shape,
          oldRotation: shape.userData.startRotation ? shape.userData.startRotation.clone() : shape.quaternion.clone(),
          newRotation: shape.quaternion.clone(),
          oldPosition: shape.userData.startPosition ? shape.userData.startPosition.clone() : shape.position.clone(),
          newPosition: shape.position.clone()
        };
      })
    };
    undoStack.push(rotationAction);
    redoStack.length = 0;

    // Prevent the immediate click after releasing the gizmo from re-selecting objects behind the ring
    window.suppressNextClick = true;
  }

  // Hide rotate indicator box
  const rotateIndicatorBox = document.getElementById('rotate-indicator-box');
  if (rotateIndicatorBox) {
    rotateIndicatorBox.style.display = 'none';
    // reset outline color to default so next open starts with gray
    rotateIndicatorBox.style.borderColor = '#444';
  }

  // stop blocking navigation when rotate drag ends
  isDraggingRotateGizmo = false;

  draggingRotationAxis = null;
  rotateStartPoint = null;
  rotateStartVector.set(0, 0, 0);
  worldRotationAxis.set(0, 0, 0);
  
  selectedShapes.forEach(shape => {
    delete shape.userData.startRotation;
    delete shape.userData.startPosition;
  });
});

function generateOBJ() {
  const selectedOnlyCheckbox = document.getElementById('export-selected-only-checkbox');
  const exportSelectedOnly = selectedOnlyCheckbox.checked;
  
  // Determine which shapes to export
  const shapesToExport = exportSelectedOnly ? selectedShapes : shapes;
  
  let obj = '# Exported from P3D Scene\n\n';
  let vertexOffset = 1;
  
  shapesToExport.forEach((group, groupIdx) => {
    const mesh = group.children.find(c => c.isMesh);
    if (!mesh) return;
    
    obj += `# Object: Shape_${groupIdx}\n`;
    obj += `g Shape_${groupIdx}\n`;
    
    const geometry = mesh.geometry;
    geometry.computeBoundingBox();
    
    // Get position, rotation, scale
    const pos = group.position;
    const quat = group.quaternion;
    const scale = group.scale;
    
    // Convert quaternion to matrix for transformations
    const matrix = new THREE.Matrix4();
    matrix.compose(pos, quat, scale);
    
    // Export vertices
    const posAttr = geometry.getAttribute('position');
    for (let i = 0; i < posAttr.count; i++) {
      const vertex = new THREE.Vector3(posAttr.getX(i), posAttr.getY(i), posAttr.getZ(i));
      vertex.applyMatrix4(matrix);
      obj += `v ${vertex.x.toFixed(6)} ${vertex.y.toFixed(6)} ${vertex.z.toFixed(6)}\n`;
    }
    
    // Export faces
    if (geometry.index) {
      const indices = geometry.index.array;
      for (let i = 0; i < indices.length; i += 3) {
        const a = indices[i] + vertexOffset;
        const b = indices[i + 1] + vertexOffset;
        const c = indices[i + 2] + vertexOffset;
        obj += `f ${a} ${b} ${c}\n`;
      }
      vertexOffset += posAttr.count;
    } else {
      for (let i = 0; i < posAttr.count; i += 3) {
        const a = i + 1 + vertexOffset;
        const b = i + 2 + vertexOffset;
        const c = i + 3 + vertexOffset;
        obj += `f ${a} ${b} ${c}\n`;
      }
      vertexOffset += posAttr.count;
    }
    
    obj += '\n';
  });
  
  return obj;
}

function downloadFile(filename, data) {
  let blob;
  
  // FBX exports as String, OBJ as String, GLB as ArrayBuffer
  if (data instanceof ArrayBuffer) {
    blob = new Blob([data], { type: 'application/octet-stream' });
  } else if (typeof data === 'string') {
    blob = new Blob([data], { type: 'text/plain' });
  } else {
    blob = new Blob([data], { type: 'application/octet-stream' });
  }
  
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

// Close export menu when clicking outside or pressing ESC
window.addEventListener('click', (e) => {
  if (exportMenuActive && !exportMenu.contains(e.target)) {
    hideExportMenu();
  }
});

window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && exportMenuActive) {
    hideExportMenu();
  }
});

// Cancel button
document.getElementById('export-cancel-btn').addEventListener('click', () => {
  hideExportMenu();
});
