    /* Object manager inner area (pannable/zoomable) */
    .object-manager-content {

/* Mask element used to color icon when axis is OFF. It's absolutely positioned on top of the image to avoid any layout shift */
.axis-icon-mask {
  /* Match the move-gizmo icon size so there's no visual size change on first paint */
  width: 31px;
  height: 31px;
  display: block;
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  pointer-events: none; /* must not intercept clicks */
  background-color: transparent;
  /* Avoid animating the mask on initial load to prevent perceptible flicker */
  transition: none;
}

  background-repeat: no-repeat;
  background-position: center;
  background-size: contain;
}

  <script>
    const canvas = document.getElementById('viewport');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    canvas.tabIndex = 1;
    canvas.focus();
    let lastMouse = { x: 0, y: 0 };
    let lastMouseTarget = canvas;
    // Try to set lastMouse to the current mouse position if the mouse is over the canvas
    document.addEventListener('DOMContentLoaded', () => {
      document.body.addEventListener('mousemove', function initMouse(e) {
        if (e.target === canvas) {
          lastMouse.x = e.clientX;
          lastMouse.y = e.clientY;
          lastMouseTarget = canvas;
        }
        // Remove this listener after the first mousemove
        document.body.removeEventListener('mousemove', initMouse);
      });
    });
    renderer.setSize(window.innerWidth, window.innerHeight); // Remove - 48
    renderer.setPixelRatio(window.devicePixelRatio);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x202020);

    let camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight, // Remove - 48
      0.1,
      1000
    );
    camera.position.set(1.85, 1.2, 1.85);
    let target = new THREE.Vector3(0, 0, 0);
    camera.lookAt(target);

    // Create three grids: XZ (default), YZ, XY
    const gridXZ = new THREE.GridHelper(10000, 10000 / 0.5, 0x363636, 0x363636); // default
    gridXZ.renderOrder = 0;
    gridXZ.material.depthTest = false;
    scene.add(gridXZ);

    const gridYZ = new THREE.GridHelper(10000, 10000 / 0.5, 0x363636, 0x363636);
    gridYZ.rotation.set(0, 0, Math.PI / 2); // YZ plane
    gridYZ.renderOrder = 0;
    gridYZ.material.depthTest = false;
    scene.add(gridYZ);

    const gridXY = new THREE.GridHelper(10000, 10000 / 0.5, 0x363636, 0x363636);
    gridXY.rotation.set(Math.PI / 2, 0, 0); // XY plane
    gridXY.renderOrder = 0;
    gridXY.material.depthTest = false;
    scene.add(gridXY);

    // Hide all but XZ by default
    gridXZ.visible = true;
    gridYZ.visible = false;
    gridXY.visible = false;

    const origin = new THREE.Vector3(0, 0, 0);
    const arrowLength = 2;
    const arrowHeadLength = 0.10;
    const arrowHeadWidth = 0.045;

    function createArrow(dirVec, color) {
      const arrow = new THREE.ArrowHelper(dirVec, origin, arrowLength, color.getHex(), arrowHeadLength, arrowHeadWidth);

      // Ensure arrows render after the grid (optional)
      arrow.renderOrder = 1;
      arrow.cone.renderOrder = 1;
      arrow.line.renderOrder = 1;

      // REMOVE these lines so arrows are occluded by shapes
      // arrow.cone.material.depthTest = false;
      // arrow.line.material.depthTest = false;
      // arrow.cone.material.depthWrite = true;
      // arrow.line.material.depthWrite = true;

      return arrow;
    }

    const arrowX = createArrow(new THREE.Vector3(1, 0, 0), new THREE.Color('#b24747')); // red
    const arrowY = createArrow(new THREE.Vector3(0, 1, 0), new THREE.Color('#42ac6e')); // green
    const arrowZ = createArrow(new THREE.Vector3(0, 0, 1), new THREE.Color('#215db2')); // blue

    scene.add(arrowX);
    scene.add(arrowY);
    scene.add(arrowZ);

    const shapes = [];
    let selectedShape = null;
    let selectedShapes = []; // <-- Add this line

    const undoStack = [];
    const redoStack = [];

    function spawnShape(type, recordAction = true) {
      let geometry, mesh, group, line;

      switch (type) {
        case 'cube':
          geometry = new THREE.BoxGeometry(1, 1, 1);
          break;
        case 'sphere':
          // Reduce subdivisions (widthSegments, heightSegments) by half for performance/visual parity
          geometry = new THREE.SphereGeometry(0.5, 16, 16);
          break;
        case 'cylinder':
          geometry = new THREE.CylinderGeometry(0.5, 0.5, 1, 32);
          break;
        case 'cone':
          geometry = new THREE.ConeGeometry(0.5, 1, 32);
          break;
        case 'torus':
          geometry = new THREE.TorusGeometry(0.5, 0.18, 16, 48);
          break;
        case 'plane':
          geometry = new THREE.PlaneGeometry(1, 1);
          break;
        case 'pyramid':
          geometry = new THREE.ConeGeometry(0.7, 1, 4); // Square base pyramid
          break;
        default:
          return;
      }

      mesh = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({ color: 0x999999 }));
      // Render both faces for thin geometries like planes so they're not see-through from one side
      if (type === 'plane') {
        mesh.material.side = THREE.DoubleSide;
      }
      const edges = new THREE.EdgesGeometry(geometry);
      line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 3 }));

      group = new THREE.Group();
      group.add(mesh);
      group.add(line);

      // --- Orientation fixes ---
      if (type === 'torus') {
        group.rotation.x = Math.PI / 2; // Lay flat
      }
      if (type === 'plane') {
        // Rotate only the mesh and outline so the gizmos (attached to the group) keep their default orientation
        if (mesh) mesh.rotation.x = -Math.PI / 2; // visually lay flat
        if (line) line.rotation.x = -Math.PI / 2;
      }
      if (type === 'pyramid') {
        group.rotation.y = Math.PI / 4; // Align base with axes
        // group.rotation.x = -Math.PI / 2; // REMOVE THIS LINE
      }

      group.position.set(0, 0, 0); // Always spawn at the center
      scene.add(group);
      shapes.push(group);

      if (recordAction) {
        undoStack.push({ type: 'add', shape: group });
        redoStack.length = 0; // clear redo on new action
      }

      // Deselect any currently selected shape before selecting the new one
      deselect(null, false);
      selectShape(group);
    }

    let suppressSelectionRecording = false;

function applySelectionArray(newSelection, recordAction = true) {
  const oldSelection = selectedShapes.slice();
  const newSel = Array.isArray(newSelection) ? newSelection.slice() : [];

  // Compute diffs: only remove those not in new, and only add those not in old
  const toRemove = oldSelection.filter(g => !newSel.includes(g));
  const toAdd = newSel.filter(g => !oldSelection.includes(g));

  // Remove UI for only the removed shapes
  toRemove.forEach(g => {
    if (g.userData && g.userData.nodeEl) g.userData.nodeEl.classList.remove('selected');
    if (g.children[1] && g.children[1].material) g.children[1].material.color.set(0x000000);
    if (g.userData && g.userData.justPasted) delete g.userData.justPasted;
  });

      const dist = offset.length();

      // Reverse zoom by changing sign of e.deltaY
      let newDist = dist * (1 + e.deltaY * zoomSpeed);

      // Clamp zoom distance
      newDist = Math.min(Math.max(newDist, 0.1), 30);

      offset.setLength(newDist);
      camera.position.copy(target).add(offset);
      camera.lookAt(target);
    }

    // Raycasting for selecting shapes
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    function onClick(e) {
      // Suppress selection if just finished gizmo move
      if (window.suppressNextClick) {
        window.suppressNextClick = false;
        return;
      }
      // Prevent selection if clicking inside the view menu or if menu is active
      if (
        (e.target.closest && e.target.closest('#view-menu')) ||
        menuActive ||
        isOverUI(e)
      ) return;

      // Prevent selection if box selection just finished
      if (boxSelectionJustFinished) {
        boxSelectionJustFinished = false;
        return;
      }

      // Prevent selection if boxSelecting is active (shouldn't happen, but just in case)
      if (boxSelecting) return;

      // Prevent selection if we were orbiting (Shift+drag)
      if (wasOrbiting) {
        isDragging = false;
        wasOrbiting = false;
        return;
      }

      e.preventDefault();
      e.stopPropagation();

      // Only block selection if mouse is currently being dragged (button is down)
      if (e.buttons !== 0 && (isDragging || wasOrbiting)) {
        return;
      }

      const rect = canvas.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);

      const intersectObjects = shapes.map(g => g.children[0]);
      let intersects = raycaster.intersectObjects(intersectObjects);
      
      // For thin/plane objects, also check bounding box intersection
      if (intersects.length === 0) {
        intersects = intersectObjects
          .map((mesh, idx) => {
            mesh.geometry.computeBoundingBox();
            const bbox = mesh.geometry.boundingBox.clone();
            bbox.applyMatrix4(mesh.matrixWorld);
            if (raycaster.ray.intersectsBox(bbox)) {
              return { object: mesh, distance: raycaster.ray.distanceToPoint(bbox.getCenter(new THREE.Vector3())) };
            }
            return null;
          })
          .filter(x => x !== null)
          .sort((a, b) => a.distance - b.distance);
      }
      
      // In ortho views, ALWAYS use the first intersect (closest by distance)
      // The raycaster automatically sorts by distance, so this is reliable
      if (intersects.length > 0) {
        const targetIntersect = intersects[0]; // Take the closest one
        const intersectedMesh = targetIntersect.object;
        const group = shapes.find(g => g.children[0] === intersectedMesh);
        
        if (group) {
          if (e.shiftKey) {
            // Multi-select: toggle selection state
            if (selectedShapes.includes(group)) {
              deselect(group);
            } else {
              selectShape(group, true);
            }
          } else {
            // Single select: select only this, deselect others
            deselect();
            selectShape(group);
          }
          isDragging = false;
          wasOrbiting = false;
          return;
        }
      }

      if (!e.shiftKey) {
        deselect();
      }
      isDragging = false;
      wasOrbiting = false;
    }

    // --- VIEW MENU LOGIC ---
    let orthoCamera = null;
    let usingOrtho = false;
    let lock2D = false;
    let currentOrthoType = null; // Track which ortho view is active
    const viewMenu = document.getElementById('view-menu');
    let menuActive = false;
    let mouseOverMenu = false;
    let vKeyDown = false; // <-- Add here

    function showViewMenu(x, y) {
      // If mouse hasn't moved, center the menu in the canvas
      if (x === 0 && y === 0) {
        const rect = canvas.getBoundingClientRect();
        x = rect.left + rect.width / 2;
        y = rect.top + rect.height / 2;
      }
      viewMenu.style.left = x + 'px';
      viewMenu.style.top = y + 'px';
      viewMenu.style.display = 'block';
      menuActive = true;
    }

    function hideViewMenu() {
      viewMenu.style.display = 'none';
      menuActive = false;
    }

    // Add these event listeners:
    viewMenu.addEventListener('mouseenter', () => {
      mouseOverMenu = true;
    });
    viewMenu.addEventListener('mouseleave', () => {
      mouseOverMenu = false;
    });

    // Margin in pixels around the menu where it won't hide
    const MENU_MARGIN = 10;

    // Only this mousemove handler is needed:
    window.addEventListener('mousemove', (e) => {
      if (!menuActive) return;

      const rect = viewMenu.getBoundingClientRect();
      const inside =
        e.clientX >= rect.left - MENU_MARGIN &&
        e.clientX <= rect.right + MENU_MARGIN &&
        e.clientY >= rect.top - MENU_MARGIN &&
        e.clientY <= rect.bottom + MENU_MARGIN;

      if (!inside) {
        hideViewMenu();
      }
    });

    // Store camera/target for each view
    const viewStates = {
      normal: { position: camera.position.clone(), target: target.clone() },
      x: { position: new THREE.Vector3(0.7, 0, 0), target: new THREE.Vector3(0, 0, 0), zoom: 2.2 },
      y: { position: new THREE.Vector3(0, 0.7, 0), target: new THREE.Vector3(0, 0, 0), zoom: 2.2 },
      z: { position: new THREE.Vector3(0, 0, 0.7), target: new THREE.Vector3(0, 0, 0), zoom: 2.2 }
    };

    function setView(type) {
      // Save current view state before switching
      if (currentOrthoType === null || currentOrthoType === 'normal') {
        viewStates.normal.position.copy(camera.position);
        viewStates.normal.target.copy(target);
      } else if (currentOrthoType === 'x') {
        viewStates.x.position.copy(camera.position);
        viewStates.x.target.copy(target);
        viewStates.x.zoom = orthoCamera.zoom; // Save zoom
      } else if (currentOrthoType === 'y') {
        viewStates.y.position.copy(camera.position);
        viewStates.y.target.copy(target);
        viewStates.y.zoom = orthoCamera.zoom; // Save zoom
      } else if (currentOrthoType === 'z') {
        viewStates.z.position.copy(camera.position);
        viewStates.z.target.copy(target);
        viewStates.z.zoom = orthoCamera.zoom; // Save zoom
      }

      const viewIndicator = document.getElementById('view-indicator');
      if (type === 'normal') {
        if (usingOrtho) {
          camera = perspCamera;
          renderer.render(scene, camera);
          usingOrtho = false;
          lock2D = false;
        }
        // Restore previous perspective view
        camera.position.copy(viewStates.normal.position);
        target.copy(viewStates.normal.target);
        camera.lookAt(target);
        currentOrthoType = null;

        // Show only XZ grid
        gridXZ.visible = true;
        gridYZ.visible = false;
        gridXY.visible = false;

        // Show all axis arrows and labels (respect X/Y/Z toggles)
        arrowX.visible = (!hideXAxis);
        arrowY.visible = (!hideYAxis);
        arrowZ.visible = (!hideZ);
        labelX.style.display = (typeof hideXAxis !== 'undefined' && hideXAxis) ? 'none' : 'block';
        labelY.style.display = (typeof hideYAxis !== 'undefined' && hideYAxis) ? 'none' : 'block';
        labelZ.style.display = (typeof hideZ !== 'undefined' && hideZ) ? 'none' : 'block';

        viewIndicator.textContent = 'NORMAL VIEW';
      } else {
        // Use actual canvas/viewport size for aspect
        const { width, height } = getViewportSize();
        const aspect = width / height;
        const d = 3;
        if (!orthoCamera) {
          orthoCamera = new THREE.OrthographicCamera(
            -d * aspect, d * aspect, d, -d, -100, 100
          );
        } else {
          orthoCamera.left = -d * aspect;
          orthoCamera.right = d * aspect;
          orthoCamera.top = d;
          orthoCamera.bottom = -d;
          orthoCamera.updateProjectionMatrix();
        }
        camera = orthoCamera;
        usingOrtho = true;
        lock2D = true;
        currentOrthoType = type;

        // Restore previous ortho view position/target
        camera.position.copy(viewStates[type].position);
        target.copy(viewStates[type].target);
        if (viewStates[type].zoom !== undefined) {
          orthoCamera.zoom = viewStates[type].zoom;
        } else {
          orthoCamera.zoom = 2.2; // fallback default
        }
        orthoCamera.updateProjectionMatrix();

        // Show only the grid for the current view
        if (type === 'x') {
          camera.up.set(0, 1, 0);
          gridXZ.visible = false;
          gridYZ.visible = true;
          gridXY.visible = false;

          // Hide X axis and label
          arrowX.visible = false;
          labelX.style.display = "none";
          // Show others
          arrowY.visible = (!hideYAxis);
          arrowZ.visible = (!hideZ);
          labelY.style.display = (typeof hideYAxis !== 'undefined' && hideYAxis) ? 'none' : 'block';
          labelZ.style.display = (typeof hideZ !== 'undefined' && hideZ) ? 'none' : 'block';
          viewIndicator.textContent = 'X VIEW';
        } else if (type === 'y') {
          camera.up.set(0, 0, 1);
          gridXZ.visible = true;
          gridYZ.visible = false;
          gridXY.visible = false;

          // Hide Y axis and label
          arrowY.visible = false;
          labelY.style.display = "none";
          // Show others
          arrowX.visible = (!hideXAxis);
          arrowZ.visible = (!hideZ);
          labelX.style.display = (typeof hideXAxis !== 'undefined' && hideXAxis) ? 'none' : 'block';
          labelZ.style.display = (typeof hideZ !== 'undefined' && hideZ) ? 'none' : 'block';
          viewIndicator.textContent = 'Y VIEW';
        } else if (type === 'z') {
          camera.up.set(0, 1, 0);
          gridXZ.visible = false;
          gridYZ.visible = false;
          gridXY.visible = true;

          // Hide Z axis and label
          arrowZ.visible = false;
          labelZ.style.display = "none";
          // Show others
          arrowX.visible = (!hideXAxis);
          arrowY.visible = (!hideYAxis);
          labelX.style.display = (typeof hideXAxis !== 'undefined' && hideXAxis) ? 'none' : 'block';
          labelY.style.display = (typeof hideYAxis !== 'undefined' && hideYAxis) ? 'none' : 'block';
          viewIndicator.textContent = 'Z VIEW';
        }
        camera.lookAt(target);
        camera.updateProjectionMatrix();
      }
      updateMoveGizmoAxisVisibility(); // <-- Add this line at the end of setView
     updateRotateGizmoAxisVisibility(); // <-- Ensure rotate gizmo rings update when switching views
    }

    // Save original perspective camera for toggling
    let perspCamera = camera; // <-- CHANGED FROM let perspCamera = camera;

    document.querySelectorAll('#ui button').forEach(btn => {
      btn.addEventListener('click', e => e.stopPropagation());
    });

    window.addEventListener('mousedown', onMouseDown);
    window.addEventListener('mouseup', onMouseUp);
    window.addEventListener('mousemove', onMouseMove);
    window.addEventListener('wheel', onWheel, { passive: false });
    canvas.addEventListener('click', onClick);
    window.addEventListener('keydown', (e) => {
      // Only allow Space to toggle box selection if mouse is over the canvas (viewport)
      if (
        (e.code === 'Space' || e.key === ' ') &&
        document.elementFromPoint(lastMouse.x, lastMouse.y) === canvas
      ) {
        e.preventDefault();
        boxSelectionBlockerBlock.click();
        return;
      }

      // Only allow Move Tool shortcut if mouse is over the canvas (viewport)
      if (
        e.key.toLowerCase() === 'm' &&
        document.elementFromPoint(lastMouse.x, lastMouse.y) === canvas &&
        !isOverUI(e)
      ) {
        moveGizmoBtn.click();
        return;
      }

      // Enable Rotate Tool with R if mouse is over canvas (viewport)
      if (
        e.key.toLowerCase() === 'r' &&
        document.elementFromPoint(lastMouse.x, lastMouse.y) === canvas &&
        !isOverUI(e)
      ) {
        // Toggle Rotate (pressing R again turns it off)
        rotateGizmoEnabled = !rotateGizmoEnabled;

        if (rotateGizmoEnabled) {
          // Exclusively enable Rotate -> disable other tools
          moveGizmoEnabled = false;
          scaleModeEnabled = false;

          document.getElementById('side-o-btn').style.background = '#0072cf';
          document.getElementById('move-gizmo-btn').style.background = '';
          const sBtn = document.getElementById('side-c-btn');
          if (sBtn) sBtn.style.background = '';
        } else {
          const sideO = document.getElementById('side-o-btn');
          if (sideO) sideO.style.background = '';
        }

        updateMoveGizmoButton();
        updateMoveGizmoVisibility();
        updateRotateGizmoVisibility();

        return;
      }

      if (e.key === 'Delete') {
        deleteSelectedShape();
      } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) {
        // Ctrl+Z (without Shift) -> Undo
        e.preventDefault();
        undo();
      } else if ((e.ctrlKey || e.metaKey) && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase() === 'z'))) {
        // Ctrl+Y OR Ctrl+Shift+Z -> Redo
        e.preventDefault();
        redo();
      } else if (
        e.key.toLowerCase() === 'v' &&
        !e.ctrlKey && !e.metaKey && !menuActive &&
        !vKeyDown &&
        lastMouseTarget === canvas &&
        (lastMouse.x !== 0 || lastMouse.y !== 0)
      ) {
        showViewMenu(lastMouse.x, lastMouse.y);
        vKeyDown = true;
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key.toLowerCase() === 'v') {
        vKeyDown = false; // Reset flag when V is released
      }
      if (e.key === 'Shift') {
        isRotating = false;
        isPanning = false;
      }
    });

    // Handle menu clicks
    viewMenu.addEventListener('mousedown', (e) => {
      e.stopPropagation();
      e.stopImmediatePropagation();
      e.preventDefault(); // <-- Add this line to block default click-through
      const btn = e.target.closest('button');
      if (btn) {
        setView(btn.dataset.view);
        hideViewMenu();
      }
    });

    viewMenu.addEventListener('click', (e) => {
      e.stopPropagation();
      e.stopImmediatePropagation();
      e.preventDefault(); // <-- Add this line to block default click-through
    });

const fileDropdown = document.getElementById('file-dropdown');
const FILE_ANIM_MS = 180;

function hideFileDropdown() {
  // start hide animation
  fileDropdown.classList.remove('visible');
  fileDropdown.setAttribute('aria-hidden', 'true');
  // after animation, remove from flow to avoid mouse intercept
  setTimeout(() => {
    if (!fileDropdown.classList.contains('visible')) fileDropdown.style.display = 'none';
  }, FILE_ANIM_MS + 10);
}

function showFileDropdown(rect) {
  fileDropdown.style.width = rect.width + 'px';
  fileDropdown.style.left = rect.left + 'px';
  fileDropdown.style.top = (rect.bottom) + 'px'; // put dropdown directly under the File button (no gap)
  // ensure it's in DOM flow before starting the animation
  fileDropdown.style.display = 'block';
  // allow layout then start transition
  requestAnimationFrame(() => {
    fileDropdown.classList.add('visible');
    fileDropdown.setAttribute('aria-hidden', 'false');
  });
}

fileBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  const rect = fileBtn.getBoundingClientRect();
  // use computed display check so the logic works during transitions
  if (fileDropdown.classList.contains('visible')) {
    hideFileDropdown();
  } else {
    showFileDropdown(rect);
  }
});

// Prevent dropdown clicks from closing itself
fileDropdown.addEventListener('click', (e) => {
  e.stopPropagation();
});

// Close when clicking elsewhere or pressing ESC
window.addEventListener('click', () => hideFileDropdown());
window.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideFileDropdown(); });

// NEW: Close when mouse leaves the dropdown (but not if over the File button)
fileDropdown.addEventListener('mouseleave', (e) => {
  // Don't close if mouse moved to the File button
  if (!fileBtn.contains(e.relatedTarget)) {
    hideFileDropdown();
  }
});

// Also add mouseleave to File button to close dropdown when leaving it

  // Don't close if mouse moved to the dropdown
  if (!fileDropdown.contains(e.relatedTarget)) {
    hideFileDropdown();
  }
});

// Hook up the menu buttons (save / open)
function collectProjectData() {
  const shapesData = shapes.map(group => {
    const mesh = group.children.find(c => c.isMesh);
    const geom = mesh ? mesh.geometry : null;
    let customGeometry = null;

    if (geom && geom.isBufferGeometry && (!geom.parameters || Object.keys(geom.parameters).length === 0)) {
      const pos = geom.getAttribute && geom.getAttribute('position');
      if (pos && pos.array) {
        customGeometry = Array.from(pos.array);
      }
    }

    return {
      geometryType: geom ? geom.type : 'BoxGeometry',
      parameters: geom && geom.parameters ? geom.parameters : null,
      customGeometry: customGeometry,
      position: { x: group.position.x, y: group.position.y, z: group.position.z },
      quaternion: { x: group.quaternion.x, y: group.quaternion.y, z: group.quaternion.z, w: group.quaternion.w },
      scale: { x: group.scale.x, y: group.scale.y, z: group.scale.z },
      userData: group.userData || {}
    };
  });

  const cameraState = {
    usingOrtho: !!usingOrtho,
    currentOrthoType: currentOrthoType || null,
    // perspective camera snapshot
    persp: {
      position: (perspCamera && perspCamera.position) ? perspCamera.position.toArray() : camera.position.toArray(),
      target: target ? target.toArray() : [0,0,0]
    },
    ortho: orthoCamera ? {
      position: orthoCamera.position.toArray(),
      target: target ? target.toArray() : [0,0,0],
      zoom: orthoCamera.zoom
    } : null
  };

  const toolState = {
    moveGizmoEnabled: !!moveGizmoEnabled,
    rotateGizmoEnabled: !!rotateGizmoEnabled,
    scaleModeEnabled: !!scaleModeEnabled
  };

  const selectedIndices = selectedShapes.map(s => shapes.indexOf(s)).filter(i => i >= 0);

  return {
    version: 1,
    created: Date.now(),
    cameraState,
    toolState,
    shapes: shapesData,
    selectedIndices
  };
}

function downloadProjectFile(filename = 'project.p3ds', dataObj) {
  try {
    const json = JSON.stringify(dataObj, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch(err) {
    console.error('Failed to prepare project file', err);
    alert('Save failed: ' + (err && err.message ? err.message : 'unknown error'));
  }
}

// Map geometry type -> spawn type used by spawnShape()
function geometryTypeToSpawnType(type, params) {
  if (type === 'BoxGeometry') return 'cube';
  if (type === 'SphereGeometry') return 'sphere';
  if (type === 'CylinderGeometry') return 'cylinder';
  if (type === 'ConeGeometry') {
    // pyramid was created as Cone with radialSegments = 4
    if (params && params.radialSegments === 4) return 'pyramid';
    return 'cone';
  }
  if (type === 'TorusGeometry') return 'torus';
  if (type === 'PlaneGeometry') return 'plane';
  // default fallback
  return 'cube';
}

// Create shapes from serialized data (not recording undo actions)
function createShapeFromData(sdata) {

  // --- Handle embedded custom geometry (imported models) ---
  if (sdata && sdata.customGeometry && Array.isArray(sdata.customGeometry)) {
    try {
      const floatArray = new Float32Array(sdata.customGeometry);
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(floatArray, 3));
      geo.computeVertexNormals();

      const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0x999999 }));
      const edges = new THREE.EdgesGeometry(geo);
      const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000 }));

      const group = new THREE.Group();
      group.add(mesh);
      group.add(line);

      if (sdata.position) group.position.set(sdata.position.x, sdata.position.y, sdata.position.z);
      if (sdata.quaternion) group.quaternion.set(sdata.quaternion.x, sdata.quaternion.y, sdata.quaternion.z, sdata.quaternion.w);
      if (sdata.scale) group.scale.set(sdata.scale.x, sdata.scale.y, sdata.scale.z);

      group.userData = sdata.userData || {};

      scene.add(group);
      shapes.push(group);
      return group;
    } catch (err) {
      console.warn('Failed to reconstruct custom geometry, falling back to primitive:', err);
    }
  }

  const type = geometryTypeToSpawnType(sdata.geometryType, sdata.parameters);
  // Build geometry based on parameters where possible
  let geo;
  const p = sdata.parameters || {};
  switch (type) {
    case 'cube': geo = new THREE.BoxGeometry(p.width || 1, p.height || 1, p.depth || 1); break;
    case 'sphere': geo = new THREE.SphereGeometry(p.radius || 0.5, p.widthSegments || 32, p.heightSegments || 32); break;
    case 'cylinder': geo = new THREE.CylinderGeometry(p.radiusTop || 0.5, p.radiusBottom || 0.5, p.height || 1, p.radialSegments || 32); break;
    case 'cone': geo = new THREE.ConeGeometry(p.radius || 0.5, p.height || 1, p.radialSegments || 32); break;
    case 'torus': geo = new THREE.TorusGeometry(p.radius || 0.5, p.tube || 0.18, p.radialSegments || 16, p.tubularSegments || 48); break;
    case 'plane': geo = new THREE.PlaneGeometry(p.width || 1, p.height || 1); break;
    case 'pyramid': geo = new THREE.ConeGeometry(p.radius || 0.7, p.height || 1, 4); break;
    default: geo = new THREE.BoxGeometry(1,1,1); break;
  }

  const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0x999999 }));
  const edges = new THREE.EdgesGeometry(geo);
  const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 3 }));
  const group = new THREE.Group();
  group.add(mesh);
  group.add(line);

  // Orientation fixes used by spawnShape
  if (type === 'torus') group.rotation.x = Math.PI / 2;
  if (type === 'plane') group.rotation.x = -Math.PI / 2;
  if (type === 'pyramid') group.rotation.y = Math.PI / 4;

  // Set transform & userdata
  if (sdata.position) group.position.set(sdata.position.x, sdata.position.y, sdata.position.z);
  if (sdata.quaternion) group.quaternion.set(sdata.quaternion.x, sdata.quaternion.y, sdata.quaternion.z, sdata.quaternion.w);
  if (sdata.scale) group.scale.set(sdata.scale.x, sdata.scale.y, sdata.scale.z);
  group.userData = sdata.userData || {};

  scene.add(group);
  shapes.push(group);
  return group;
}

function clearAllShapes() {
  // remove shapes from scene and clear arrays
  shapes.forEach(g => scene.remove(g));
  shapes.length = 0;
  selectedShapes.length = 0;
  selectedShape = null;
  // clear undo/redo
  undoStack.length = 0;
  redoStack.length = 0;
  updateMoveGizmoVisibility();
  updateRotateGizmoVisibility();
}

function restoreProject(data) {
  if (!data || !Array.isArray(data.shapes)) {
    alert('Invalid project file.');
    return;
  }

  // clear existing shapes
  clearAllShapes();

  // Recreate shapes
  data.shapes.forEach(s => createShapeFromData(s));

  // Restore camera
  try {
    if (data.cameraState && data.cameraState.usingOrtho) {
      // Ensure ortho camera exists
      if (!orthoCamera) {
        const { width, height } = getViewportSize();
        const aspect = width / height;
        const d = 3;
        orthoCamera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, -100, 100);
      }
      if (data.cameraState.ortho) {
        const o = data.cameraState.ortho;
        camera = orthoCamera;
        usingOrtho = true;
        lock2D = true;
        currentOrthoType = data.cameraState.currentOrthoType || null;
        orthoCamera.position.fromArray(o.position || [0,0,0]);
        if (o.zoom) orthoCamera.zoom = o.zoom;
        orthoCamera.updateProjectionMatrix();
        target.fromArray(o.target || [0,0,0]);
      } else {
        // fallback to perspective if ortho snapshot missing
        usingOrtho = false;
        camera = perspCamera;
        lock2D = false;
      }
    } else {
      // restore perspective
      usingOrtho = false;
      camera = perspCamera || camera;
      lock2D = false;
      if (data.cameraState && data.cameraState.persp) {
        const p = data.cameraState.persp;
        camera.position.fromArray(p.position || camera.position.toArray());
        target.fromArray(p.target || target.toArray());
        camera.lookAt(target);
      }
    }
  } catch (err) {
    console.warn('Failed to restore camera fully', err);
  }

  // Restore tools state
  if (data.toolState) {
    moveGizmoEnabled = !!data.toolState.moveGizmoEnabled;
    rotateGizmoEnabled = !!data.toolState.rotateGizmoEnabled;
    scaleModeEnabled = !!data.toolState.scaleModeEnabled;

    // Update button visuals
    updateMoveGizmoButton();
    const sideO = document.getElementById('side-o-btn');
    const sBtn = document.getElementById('side-c-btn');
    if (sideO) sideO.style.background = rotateGizmoEnabled ? '#0072cf' : '';
    if (sBtn) sBtn.style.background = scaleModeEnabled ? '#0072cf' : '';
    const moveBtn = document.getElementById('move-gizmo-btn');
    if (moveBtn) moveBtn.style.background = moveGizmoEnabled ? '#0072cf' : '';
  }

  // Restore selection
  deselect();
  if (Array.isArray(data.selectedIndices)) {
    data.selectedIndices.forEach(idx => {
      if (typeof idx === 'number' && shapes[idx]) selectShape(shapes[idx], true);
    });
    // If only one selected ensure selectedShape points at first
    if (selectedShapes.length > 0) selectedShape = selectedShapes[selectedShapes.length-1];
  }

  // Recreate gizmos for current tool visibility
  updateMoveGizmoVisibility();
  updateRotateGizmoVisibility();

  // Done
}

// Add this function to parse and import OBJ files
function importOBJ(objText) {
  const lines = objText.split('\n');
  const vertices = [];
  const faces = [];
  
  // Parse OBJ file
  lines.forEach(line => {
    line = line.trim();
    if (!line || line.startsWith('#')) return;
    
    const parts = line.split(/\s+/);
    const cmd = parts[0];
    
    if (cmd === 'v') {
      // Vertex position
      vertices.push(new THREE.Vector3(
        parseFloat(parts[1]) || 0,
        parseFloat(parts[2]) || 0,
        parseFloat(parts[3]) || 0
      ));
    } else if (cmd === 'f') {
      // Face (support triangles and quads)
      const indices = [];
      for (let i = 1; i < parts.length; i++) {
        const vertexData = parts[i].split('/');
        const vertexIndex = parseInt(vertexData[0]) - 1; // OBJ uses 1-based indexing
        if (vertexIndex >= 0 && vertexIndex < vertices.length) {
          indices.push(vertexIndex);
        }
      }
      // If quad, split into two triangles
      if (indices.length === 4) {
        faces.push([indices[0], indices[1], indices[2]]);
        faces.push([indices[0], indices[2], indices[3]]);
      } else if (indices.length === 3) {
        faces.push(indices);
      }
    }
  });
  
  if (vertices.length === 0) {
    alert('No vertices found in OBJ file');
    return;
  }
  
  // Create geometry from parsed data
  const geometry = new THREE.BufferGeometry();
  const positionArray = new Float32Array(faces.length * 3 * 3);
  
  let idx = 0;
  faces.forEach(face => {
    face.forEach(vertexIndex => {
      const v = vertices[vertexIndex];
      positionArray[idx++] = v.x;
      positionArray[idx++] = v.y;
      positionArray[idx++] = v.z;
    });
  });
  
  geometry.setAttribute('position', new THREE.BufferAttribute(positionArray, 3));
  geometry.computeVertexNormals();
  
  // Create mesh and group
  const mesh = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({ color: 0x999999 }));
  const edges = new THREE.EdgesGeometry(geometry);
  const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 3 }));
  
  const group = new THREE.Group();
  group.add(mesh);
  group.add(line);
  group.position.set(0, 0, 0);
  
  scene.add(group);
  shapes.push(group);
  
  // Record action for undo
  undoStack.push({ type: 'add', shape: group });
  redoStack.length = 0;
  
  // Select the imported model
  deselect();
  selectShape(group);
  
  alert(`OBJ imported successfully! (${vertices.length} vertices, ${faces.length} faces)`);
}

      function projectToScreen(pos) {

        const rect = canvas.getBoundingClientRect();
        return {
          x: rect.left + (vector.x + 1) / 2 * rect.width,
          y: rect.top + (-vector.y + 1) / 2 * rect.height,
          inView: vector.x >= -1 && vector.x <= 1 && vector.y >= -1 && vector.y <= 1 && vector.z >= -1 && vector.z <= 1
        };
      }

      const offset = 0.05;

      // Right bar position and margin for "underlap"

        // Allow label to go under right bar for RIGHT_UNDERLAP px before hiding

        if ((orthoType === 'x' && typeof hideXAxis !== 'undefined' && hideXAxis) ||
            (orthoType === 'y' && typeof hideYAxis !== 'undefined' && hideYAxis) ||

        label.style.display = shouldShow ? "block" : "none";
      }

      showLabel(posX, labelX, 'x');

    }

    // --- BOX SELECTION AND CLICK SELECTION LOGIC ---

    let boxSelecting = false;
    let boxSelectionJustFinished = false;
    let boxStart = { x: 0, y: 0 };
    let boxEnd = { x: 0, y: 0 };
    const boxDiv = document.getElementById('box-select');
    let mouseDownPos = null;
    let mouseMovedForBox = false;

    // Helper to get mouse position relative to canvas
    function getMousePosCanvas(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      };
    }

    // Mouse events for box selection and click selection
    window.addEventListener('mousedown', (e) => {

        e.shiftKey ||
        !boxSelectionEnabled ||
        isMovingWithGizmo // <--- keep existing
      ) return;

      // Only start if mouse is over the canvas
      if (e.target !== canvas) return;

      mouseDownPos = getMousePosCanvas(e);
      mouseMovedForBox = false;
      boxSelecting = false;
      // Add these lines:
      boxStart = getMousePosCanvas(e);
      boxEnd = getMousePosCanvas(e);
    });

    window.addEventListener('mousemove', (e) => {
      lastMouse.x = e.clientX;
      lastMouse.y = e.clientY;

      // --- Box selection logic ---
      if (

        mouseDownPos && e.buttons === 1 && e.target === canvas && !isOverUI(e) &&
        !isMovingWithGizmo && !isDraggingRotateGizmo // <-- NEW: don't box-select while rotating gizmo
      ) {
        const pos = getMousePosCanvas(e);
        if (!boxSelecting && (Math.abs(pos.x - mouseDownPos.x) > 4 || Math.abs(pos.y - mouseDownPos.y) > 4)) {
          boxSelecting = true;
          boxStart = mouseDownPos;
        }
        if (boxSelecting) {
          boxEnd = pos;
          updateBoxDiv();
          mouseMovedForBox = true;
        }
      }
    });

    window.addEventListener('mouseup', (e) => {
      if (!boxSelectionEnabled || isMovingWithGizmo) return; // <--- ADD isMovingWithGizmo

      if (boxSelecting) {
        boxSelecting = false;
        boxDiv.style.display = 'none';
        performBoxSelection();
        boxSelectionJustFinished = true;
        mouseDownPos = null;
        mouseMovedForBox = false;
        e.preventDefault();
        return;
      }
      // If mouse was pressed and released on canvas without dragging, treat as click
      if (
        mouseDownPos &&
        e.target === canvas &&
        !mouseMovedForBox &&
        !isOverUI(e)
      ) {
        // Simulate a click for selection
        onClick(e);
      }
      mouseDownPos = null;
      mouseMovedForBox = false;
    });

    // Update the visual selection rectangle
    function updateBoxDiv() {
      const minX = Math.min(boxStart.x, boxEnd.x);
      const minY = Math.min(boxStart.y, boxEnd.y);
      const maxX = Math.max(boxStart.x, boxEnd.x);
      const maxY = Math.max(boxStart.y, boxEnd.y);
      const rect = canvas.getBoundingClientRect();
      boxDiv.style.left = (rect.left + minX) + 'px';
      boxDiv.style.top = (rect.top + minY) + 'px';
      boxDiv.style.width = (maxX - minX) + 'px';
      boxDiv.style.height = (maxY - minY) + 'px';
      boxDiv.style.display = (maxX - minX > 4 && maxY - minY > 4) ? 'block' : 'none';
    }

    // Perform selection of shapes inside the box (by projecting their center)
    function performBoxSelection() {
      const rect = canvas.getBoundingClientRect();
      const minX = Math.min(boxStart.x, boxEnd.x) / rect.width * 2 - 1;
      const maxX = Math.max(boxStart.x, boxEnd.x) / rect.width * 2 - 1;
      const minY = -((Math.max(boxStart.y, boxEnd.y) / rect.height) * 2 - 1);
      const maxY = -((Math.min(boxStart.y, boxEnd.y) / rect.height) * 2 - 1);

      if (Math.abs(boxEnd.x - boxStart.x) < 4 || Math.abs(boxEnd.y - boxStart.y) < 4) return;

      deselect();

      console.log('Selection box NDC:', minX, maxX, minY, maxY);
      shapes.forEach(group => {
        group.updateMatrixWorld(true);
        const mesh = group.children[0];
        // Get geometry center in local space
        mesh.geometry.computeBoundingBox();
        const bbox = mesh.geometry.boundingBox;
        const center = bbox.getCenter(new THREE.Vector3());
        // Transform to world space
        mesh.localToWorld(center);
        center.project(camera);

        if (
          center.x >= minX && center.x <= maxX &&
          center.y >= minY && center.y <= maxY
        ) {
          selectShape(group, true);
        }
      });
    }

    function isOverUI(e) {
      // Check if mouse is over any UI element
      const uiIds = ['top-bar', 'ui', 'view-menu', 'box-select', 'shape-buttons'];
      let el = e.target;
      while (el) {
        if (el.id && uiIds.includes(el.id)) return true;
        if (el.classList && el.classList.contains('shape-btn')) return true;
        el = el.parentElement;
      }
      return false;
    }

    canvas.tabIndex = 1; // Make canvas focusable
    canvas.focus();      // Focus canvas on load
    canvas.addEventListener('mousedown', () => canvas.focus()); // Ensure canvas is focused on mousedown

const objectManager = (function() {
  const managerEl = document.getElementById('global-right-rect');
  const content = managerEl.querySelector('.object-manager-content');
  const svg = managerEl.querySelector('.object-manager-svg');
  const nodesLayer = managerEl.querySelector('.nodes-layer');

  let nodeBoxSelecting = false;
  let nodeBoxSelectionJustFinished = false;
  let nodeBoxStart = { x: 0, y: 0 };
  let nodeBoxEnd = { x: 0, y: 0 };
  let nodeMouseDownPos = null;
  let nodeMouseMovedForBox = false;
  // HIDE node selection state and helpers (select/deselect exposed via returned API)
  let visibilityNodeSelected = false;
  function selectVisibilityNode(additive = false) {
    const entry = nodesMap[VIS_ID];
    if (!entry || !entry.userData || !entry.userData.nodeEl) return;
    const nodeEl = entry.userData.nodeEl;
    if (!additive) {
      // clear other selections (do it silently so selection recording happens only once)
      if (typeof deselect === 'function') deselect(null, false);
    }
    nodeEl.classList.add('hide-selected');
    visibilityNodeSelected = true;
  }
  function deselectVisibilityNode() {
    const entry = nodesMap[VIS_ID];
    if (!entry || !entry.userData || !entry.userData.nodeEl) return;
    entry.userData.nodeEl.classList.remove('hide-selected');
    visibilityNodeSelected = false;
  }
  // Helper: get mouse position relative to the object-manager content element
  function getMousePosContent(e) {
    const rect = content.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }



  // Bottom-left indicator that shows the current hovered node name (defaults to 'NODE')
  const objectManagerIndicator = managerEl.querySelector('.object-manager-indicator') || (function(){
    const el = document.createElement('div');
    el.className = 'object-manager-indicator';
    el.innerHTML = '<span class="object-manager-indicator-text">NODE</span>';
    managerEl.appendChild(el);
    return el;
  })();
  function setObjectManagerIndicator(name) {
    const textEl = objectManagerIndicator.querySelector('.object-manager-indicator-text');
    if (!textEl) return;
    textEl.textContent = (name || 'NODE').toUpperCase();
  }

  // Bottom-right counter element (shows number of nodes excluding HIDE)
  const objectManagerCountEl = managerEl.querySelector('.object-manager-count') || (function(){
    const el = document.createElement('div');
    el.className = 'object-manager-count';
    el.innerHTML = '<span class="object-manager-count-text">0 NODES</span>';
    managerEl.appendChild(el);
    return el;
  })();
  function updateObjectManagerNodeCount() {
    try {
      let count = 0;
      if (nodesMap && typeof nodesMap === 'object') {
        count = Object.keys(nodesMap).filter(k => k !== VIS_ID).length;
      } else if (typeof shapes !== 'undefined') {
        count = shapes.length;
      }
      const textEl = objectManagerCountEl.querySelector('.object-manager-count-text');
      if (!textEl) return;
      textEl.textContent = count + ' ' + (count === 1 ? 'NODE' : 'NODES');
    } catch (err) { /* ignore */ }
  }

  // Observe DOM changes in the nodes layer so the count stays accurate instantly
  try {
    if (window.MutationObserver && nodesLayer) {
      function adjustObjectNodeHeights() {
        try {
          document.querySelectorAll('.object-node:not(.visibility-instance)').forEach(el => {
            // set inline height to the computed offsetHeight so visuals and inline styles match
            el.style.height = el.offsetHeight + 'px';
          });
        } catch (err) {}
      }
      const nodeLayerObserver = new MutationObserver(() => { updateObjectManagerNodeCount(); adjustObjectNodeHeights(); });
      nodeLayerObserver.observe(nodesLayer, { childList: true });
    }
  } catch (err) {}

  // If pointer moves over empty content area, reset to default
  content.addEventListener('pointermove', (e) => {
    try {
      if (!e.target || !e.target.closest || !e.target.closest('.object-node')) {
        setObjectManagerIndicator('NODE');
      }
    } catch (err) {}
  });

  // Initialize the node count display and fix existing node heights
  updateObjectManagerNodeCount();
  try { if (typeof adjustObjectNodeHeights === 'function') adjustObjectNodeHeights(); } catch (err) {}


  // Wire delete indicator: a small red circled X that follows the pointer over wires
  const wireDeleteIndicator = document.createElement('div');
  wireDeleteIndicator.className = 'wire-delete-indicator';
  wireDeleteIndicator.textContent = '✖';
  wireDeleteIndicator.style.display = 'none';
  if (content) content.appendChild(wireDeleteIndicator);

  // Helper: ensure unique node names (case-insensitive). Returns an uppercase unique name.
  function getUniqueNodeName(desired, excludeId) {
    const raw = String(desired || '').trim();
    if (!raw) return '';
    // Parse base name and optional numeric suffix at the end (e.g., "CUBE 1")
    const m = raw.match(/^(.*?)(?:\s+(\d+))?$/);
    let base = (m && m[1]) ? m[1].trim().toUpperCase() : raw.toUpperCase();
    const desiredNum = (m && m[2]) ? parseInt(m[2], 10) : null;

    // Collect all numeric suffixes already used for this base (case-insensitive)
    const used = new Set();
    Object.keys(nodesMap).forEach(id => {
      if (excludeId && id === excludeId) return; // ignore the node being renamed
      const g = nodesMap[id]; if (!g) return;
      const n = (g.userData && g.userData.name) || g.name || '';
      if (!n) return;
      const nn = String(n).trim().toUpperCase();
      const mm = nn.match(new RegExp('^' + base.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '(?:\\s+(\\d+))?$'));
      if (mm) {
        used.add(mm[1] ? parseInt(mm[1],10) : 0);
      }
    });

    // If desired had no numeric suffix and base isn't in use, return base
    if (desiredNum === null && !used.has(0)) return base;

    // If desired included a number but that exact combination isn't used, prefer it
    if (desiredNum !== null && !used.has(desiredNum)) return base + ' ' + desiredNum;

    // Otherwise pick the smallest positive integer not in use (or next after max if desired had number)
    let i = 1;
    if (desiredNum !== null) {
      // start after max used
      let max = -1; used.forEach(v => { if (v > max) max = v; });
      i = max + 1;
    } else {
      while (used.has(i)) i++;
    }
    return base + ' ' + i;

  function showWireDeleteIndicator(clientX, clientY) {

  const nodesMap = {}; // id -> group

  function rgbToHex(rgb) {

    const m = rgb.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
    if (!m) return rgb;
    const r = parseInt(m[1]).toString(16).padStart(2, '0');
    const g = parseInt(m[2]).toString(16).padStart(2, '0');
    const b = parseInt(m[3]).toString(16).padStart(2, '0');
    return `#${r}${g}${b}`;
  }

  function setCanvasTransform() {
    const canvas = managerEl.querySelector('.object-manager-canvas');
    canvas.style.transform = `translate(${pan.x}px, ${pan.y}px) scale(${scale})`;
    // Recalculate connection lines to account for the new transform
    updateAllLines();

    if (connecting && connecting.line && connecting.sourceId && (connecting.lastLocal || connecting.lastClient)) {
      const source = nodesMap[connecting.sourceId];
      if (source && source.userData && source.userData.nodeEl) {
        const nodeEl = source.userData.nodeEl;
        // Compute start in screen coordinates using DOM bounding boxes so
        // transforms (scale/pan) won't desync endpoints.
        const contentRect = content.getBoundingClientRect();
        let startScreen;
        if (connecting.isVisibility && connecting.portType) {
          const portEl = nodeEl.querySelector('.visibility-port' + (connecting.portType === 'viewport' ? '.blue' : '.red'));

            const r = portEl.getBoundingClientRect();
            startScreen = { x: r.left + r.width / 2 - contentRect.left, y: r.top + r.height / 2 - contentRect.top };
          } else {

            const pos = { x: parseFloat(nodeEl.style.left || 0), y: parseFloat(nodeEl.style.top || 0) };

  // Create a visual node for a THREE.Group
  function createNodeForGroup(group) {
    const id = group.uuid;
    const node = template.content.firstElementChild.cloneNode(true);
    node.dataset.id = id;
    // Set type label (CUBE, SPHERE, etc.) and name
    const typeLabel = getTypeLabel(group);
    // Ensure a unique uppercase name for this node (use provided name if any, but always make unique)
    const requestedName = (group.userData && group.userData.name) ? group.userData.name : typeLabel;
    const uniqueName = getUniqueNodeName(requestedName, group.uuid);
    group.userData = group.userData || {};
    group.userData.name = uniqueName;
    group.name = uniqueName;
    const initialName = uniqueName;
    // Show either user-provided name or the type label. Allow renaming on double-click for object nodes.
    const typeEl = node.querySelector('.object-node-type');
    // Truncate display to 5 non-space characters + ellipsis for layout; show full text in title tooltip and when editing
    function displayShort(s) {
      if (!s) return '';
      // Count non-space characters; spaces do not count toward the visible limit
      const nonSpaceCount = (s.match(/\S/g) || []).length;
      if (nonSpaceCount <= 5) return s;
      // Build substring including characters until we have encountered 5 non-space characters
      let seen = 0;
      let cutIndex = s.length;
      for (let i = 0; i < s.length; i++) {
        if (/\S/.test(s[i])) seen++;
        if (seen === 5) { cutIndex = i + 1; break; }
      }
      return s.slice(0, cutIndex) + '...';
    }
    const fullName = initialName;
    typeEl.textContent = displayShort(fullName);
    typeEl.title = fullName;
    typeEl.style.cursor = 'text';
    // Show custom tooltip box on hover (easier to read than native title)

    function startRename() {
      // Create an inline input for renaming
      const input = document.createElement('input');
      input.type = 'text';
      input.value = group.userData && group.userData.name ? group.userData.name : typeLabel;
      input.className = 'object-node-name-input';
      // Inline styles to match node label
      input.style.background = 'transparent';
      input.style.border = 'none';
      input.style.outline = 'none';
      input.style.color = window.getComputedStyle(typeEl).color || '#fff';
      input.style.fontSize = window.getComputedStyle(typeEl).fontSize || '16px';
      input.style.fontWeight = window.getComputedStyle(typeEl).fontWeight || 'bold';
      input.style.letterSpacing = '2px';
      input.style.textTransform = 'uppercase';
      input.style.padding = '0';
      input.style.margin = '0';
      input.style.width = Math.max(40, typeEl.offsetWidth + 40) + 'px';
      // Keep value uppercase while typing (preserve caret)
      input.addEventListener('input', () => {
        try {
          const start = input.selectionStart;
          const end = input.selectionEnd;
          input.value = input.value.toUpperCase();
          input.setSelectionRange(start, end);
        } catch (err) {}
      });
      // Prevent node dragging when interacting with the input
      input.addEventListener('pointerdown', (ev) => { ev.stopPropagation(); });

      // mark editing state so nodePointerDown ignores drags
      group.userData = group.userData || {};
      group.userData.editing = true;

      // Replace the label text with the input
      typeEl.textContent = '';
      typeEl.appendChild(input);
      input.focus();
      input.select();

      function commit() {
        let val = input.value.trim().toUpperCase();
        if (val) {
          // Ensure uniqueness (case-insensitive)
          val = getUniqueNodeName(val, group.uuid);
          group.userData = group.userData || {};
          group.userData.name = val;
          group.name = val;
          typeEl.textContent = displayShort(val);
          typeEl.title = val;
        } else {
          if (group.userData) delete group.userData.name;
          group.name = '';
          typeEl.textContent = displayShort(typeLabel);
          typeEl.title = typeLabel;
        }
        // clear editing flag
        if (group.userData) delete group.userData.editing;
      }

      input.addEventListener('blur', () => { commit(); });
      input.addEventListener('keydown', (ke) => {

    typeEl.addEventListener('dblclick', (e) => { e.stopPropagation(); e.preventDefault(); startRename(); });

    // lower label is always 'PARENT' and should be near the port
    // hide the small lower title (was 'PARENT') — not needed on spawned nodes
    node.querySelector('.object-node-title').textContent = '';
    nodesLayer.appendChild(node);

    // Place first object node top-left aligned with HIDE; subsequent object nodes spawn diagonally (original behavior)
    const leftInset = 16;
    const spacing = 8; // gap between stacked nodes when aligned
    // Get list of object nodes (exclude the HIDE node)
    const objectNodes = Array.from(nodesLayer.children).filter(el => el.dataset && el.dataset.id && el.dataset.id !== VIS_ID);
    const objIndex = objectNodes.indexOf(node); // index among object nodes (0 for first)
    // Use the visibility node's top position if available so the first node aligns
    const visY = (nodesMap[VIS_ID] && nodesMap[VIS_ID].userData && nodesMap[VIS_ID].userData.nodePos && typeof nodesMap[VIS_ID].userData.nodePos.y === 'number') ? nodesMap[VIS_ID].userData.nodePos.y : 16;

    let x, y;
    if (objIndex === 0) {
      // first object node: align with HIDE node at the same top position, nudged 1px left
      x = Math.max(0, leftInset - 1);
      y = visY;
    } else {
      // subsequent nodes: diagonal layout similar to original implementation
      x = 20 + objIndex * 22;
      y = 20 + objIndex * 18;
    }
    setNodePosition(node, x, y);

    group.userData.nodePos = {x, y};
    group.userData.nodeEl = node;
    nodesMap[id] = group;
    // ensure visibility state exists and apply it to the actual THREE.Group
    group.userData.visibility = group.userData.visibility || {};

    // update node counter (excludes HIDE node)
    try { updateObjectManagerNodeCount(); } catch (err) {}

    node.addEventListener('pointerdown', nodePointerDown);
    // Update object manager indicator on hover
    node.addEventListener('pointerenter', () => {

    });
    node.addEventListener('pointerleave', () => { setObjectManagerIndicator('NODE'); });

    // Support shift+click to add/remove selection like standard multi-select behavior
    node.addEventListener('click', (e) => {
      e.stopPropagation();

    node.style.width = node.offsetWidth + 'px';
    node.style.height = node.offsetHeight + 'px';

    return node;
  }

  // -------------------------
  // HIDE Node (special, cannot be deleted)

  function createVisibilityNode() {
    const id = VIS_ID;

    node.classList.add('visibility-instance');

    node.querySelector('.object-node-title').textContent = '';

    // remove any leftover port element from the cloned template so we can add our own bottom ports
    const leftoverPort = node.querySelector('.object-node-port');
    if (leftoverPort && leftoverPort.parentElement) leftoverPort.parentElement.removeChild(leftoverPort);

    // insert and position (match object nodes look exactly)
    nodesLayer.appendChild(node);
    // force a wider width inline so it expands to the right side
    node.style.width = '140px';
    // position it near the right edge of the object manager content (16px inset)
    const contentEl = managerEl.querySelector('.object-manager-content');
    const rightX = Math.max(16, Math.round((contentEl.clientWidth || 300) - node.offsetWidth - 15));
    setNodePosition(node, rightX, 16);
    // ensure type label fits and force a left nudge via inline styles (stronger than stylesheet)
    const typeEl = node.querySelector('.object-node-type');
    if (typeEl) {
      typeEl.style.fontSize = '16px';
      typeEl.style.letterSpacing = '2px';
      typeEl.style.margin = '0';
      typeEl.style.pointerEvents = 'none';
      // nudge and lift the label: make it relative so we can offset it
      typeEl.style.position = 'relative';
      typeEl.style.left = '36px';
      typeEl.style.marginTop = '-16px'; // move label slightly higher
    }

    // store a lightweight entry in nodesMap (not a THREE.Group)
    nodesMap[id] = { uuid: id, userData: { nodeEl: node, isVisibility: true } };
    nodesMap[id].userData.nodePos = { x: rightX, y: 16 };

    // allow dragging the node itself (reuse nodePointerDown logic)
    node.addEventListener('pointerdown', (e) => {

      if (e && typeof e.button !== 'undefined' && e.button !== 0) return;

    });

    node.addEventListener('pointerenter', () => { setObjectManagerIndicator('HIDE'); });
    node.addEventListener('pointerleave', () => { setObjectManagerIndicator('NODE'); });

    node.addEventListener('click', (e) => {
      e.stopPropagation();

      if (typeof e.button !== 'undefined' && e.button !== 0) return;
      const additive = !!e.shiftKey;
      if (visibilityNodeSelected) {
        if (additive) {
          deselectVisibilityNode();
        } else {

        }

    const b2 = document.createElement('div'); b2.className = 'visibility-port red'; b2.dataset.port = 'render';

    node.appendChild(b1); node.appendChild(b2);

    const l1 = document.createElement('div'); l1.className = 'visibility-port-label blue'; l1.textContent = 'VIEWPORT';

    b1.addEventListener('pointerdown', visibilityBottomPointerDown);

    for (let i = connections.length - 1; i >= 0; i--) {

        if (c.line && c.line.parentNode) {

          }

        connections.splice(i, 1);
      }
    }
  }

  
  

  function getTypeLabel(group) {
    const mesh = group.children.find(c => c.isMesh);
    if (!mesh || !mesh.geometry) return 'OBJECT';
    const geom = mesh.geometry;
    const t = geom.type || '';
    if (t === 'BoxGeometry') return 'CUBE';
    if (t === 'SphereGeometry') return 'SPHERE';
    if (t === 'CylinderGeometry') return 'CYLINDER';
    if (t === 'ConeGeometry') {
      // Pyramid (4 radial segments) detection
      if (geom.parameters && geom.parameters.radialSegments === 4) return 'PYRAMID';
      return 'CONE';
    }
    if (t === 'TorusGeometry') return 'TORUS';
    if (t === 'PlaneGeometry') return 'PLANE';
    return t.replace('Geometry','').toUpperCase();
  }

  function setNodePosition(node, x, y) {
    node.style.left = x + 'px';
    node.style.top = y + 'px';
  }

  // Node drag
  let dragging = null;
  function nodePointerDown(e) {
    // Ignore non-primary button drags (middle/right) to prevent accidental moves
    if (e && typeof e.button !== 'undefined' && e.button !== 0) return;

    // Ignore drags if user is currently renaming this node
    const id = node && node.dataset && node.dataset.id;
    const group = id ? nodesMap[id] : null;
    if (group && group.userData && group.userData.editing) {
      // let the input handle events; don't start node dragging
      return;
    }
    e.stopPropagation();
    node.setPointerCapture(e.pointerId);
    const start = { x: e.clientX, y: e.clientY };
    let draggingStarted = false;

    // If this node is part of a multi-selection, move the whole selection together
    const isPartOfSelection = group && selectedShapes.includes(group) && selectedShapes.length > 1;
    if (isPartOfSelection) {
      // capture start positions for each selected node
      const startPositions = selectedShapes.map(g => ({ x: g.userData.nodePos.x, y: g.userData.nodePos.y }));
      const nodeEls = selectedShapes.map(g => g.userData.nodeEl);
      const nodeIds = nodeEls.map(el => (el && el.dataset && el.dataset.id) || '');
      function move(ev) {
        // Only start moving after the user has moved a few pixels to avoid click->deselect
        const dxRaw = ev.clientX - start.x;
        const dyRaw = ev.clientY - start.y;
        const dist = Math.sqrt(dxRaw*dxRaw + dyRaw*dyRaw);
        if (!draggingStarted && dist < 3) return;
        draggingStarted = true;

        const dx = dxRaw / scale;
        const dy = dyRaw / scale;
        for (let i = 0; i < selectedShapes.length; i++) {
          const s = startPositions[i];
          const nx = s.x + dx;
          const ny = s.y + dy;
          const el = nodeEls[i];
          const nid = nodeIds[i];
          if (el) setNodePosition(el, nx, ny);
          const g = selectedShapes[i];
          if (g && g.userData) g.userData.nodePos = { x: nx, y: ny };
          if (nid) updateConnectionsFor(nid);
        }

          setTimeout(() => { try { delete node.dataset.dragged; } catch (err) { node.removeAttribute('data-dragged'); } }, 50);

        document.removeEventListener('pointermove', move);
        document.removeEventListener('pointerup', up);
      }
      document.addEventListener('pointermove', move);
      document.addEventListener('pointerup', up);
      return;
    }

    // Single-node drag fallback (original behavior)
    const orig = { x: group.userData.nodePos.x, y: group.userData.nodePos.y };
    function move(ev) {
      const dxRaw = ev.clientX - start.x;
      const dyRaw = ev.clientY - start.y;
      const dist = Math.sqrt(dxRaw*dxRaw + dyRaw*dyRaw);
      if (!draggingStarted && dist < 3) return;
      draggingStarted = true;

      const dx = dxRaw / scale;
      const dy = dyRaw / scale;
      const nx = orig.x + dx;
      const ny = orig.y + dy;
      setNodePosition(node, nx, ny);
      group.userData.nodePos = { x: nx, y: ny };
      updateConnectionsFor(id);
    }
    function up(ev) {
      if (draggingStarted) {
        try { node.dataset.dragged = 'true'; } catch (err) { node.setAttribute('data-dragged','true'); }
        setTimeout(() => { try { delete node.dataset.dragged; } catch (err) { node.removeAttribute('data-dragged'); } }, 50);
      }
      node.releasePointerCapture(e.pointerId);
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
    }
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  }

  // Connection drag
  let connecting = null; // {sourceId, line}
  function portPointerDown(e) {

  document.querySelectorAll('button').forEach(btn => {

  });

  let timer = null;
  let activeTarget = null;

  function getTooltipText(btn) {
    if (!btn) return '';
    if (btn.dataset && btn.dataset.tooltip) return btn.dataset.tooltip;
    if (idMap[btn.id]) return idMap[btn.id];
    const aria = btn.getAttribute('aria-label');
    if (aria) return aria + ' - button';
    const txt = (btn.textContent || '').trim();
    if (txt) return txt + ' - button';
    const img = btn.querySelector('img');
    if (img && img.alt) return img.alt + ' - button';
    return '';
  }

  function showTooltip(btn) {
    const text = getTooltipText(btn);
    if (!text) return;
    tooltipEl.textContent = text;
    tooltipEl.classList.add('show');
    // Position above the element, centered
    const rect = btn.getBoundingClientRect();
    const ttRect = tooltipEl.getBoundingClientRect();
    let top = rect.top - ttRect.height - 8;
    if (top < 6) top = rect.bottom + 8; // fallback below if not enough space
    let left = Math.round(rect.left + rect.width / 2 - ttRect.width / 2);

    tooltipEl.style.top = top + 'px';
    tooltipEl.style.left = left + 'px';
  }

  function hideTooltip() {
    if (timer) { clearTimeout(timer); timer = null; }
    tooltipEl.classList.remove('show');
    activeTarget = null;
  }

  document.addEventListener('pointerenter', function(e) {
    const btn = e.target.closest('button');
    if (!btn) return;
    if (btn.disabled) return;
    activeTarget = btn;
    timer = setTimeout(() => { if (activeTarget === btn) showTooltip(btn); }, tooltipDelay);
  }, true);

  document.addEventListener('pointerleave', function(e) {
    const btn = e.target.closest('button');
    if (!btn) { hideTooltip(); return; }
    hideTooltip();
  }, true);

  // Hide on pointerdown so it doesn't linger while clicking
  document.addEventListener('pointerdown', hideTooltip, true);
})();

// --- MOVE GIZMO LOGIC ---
let moveGizmo = null;
let draggingAxis = null;
let dragStartMouse = null;
let dragStartPositions = null;

function createMoveGizmo() {
  // Remove old gizmo if any
  if (moveGizmo) {
    scene.remove(moveGizmo);
    moveGizmo = null;
  }
  // Allow gizmo to be created when either Move OR Scale mode is active
  if (!(moveGizmoEnabled || scaleModeEnabled) || selectedShapes.length === 0) return;

  moveGizmo = new THREE.Group();

  // Colors: X = red, Y = green, Z = blue
  const axes = [
    { dir: new THREE.Vector3(1,0,0), color: 0xb24747, name: 'x' },
    { dir: new THREE.Vector3(0,1,0), color: 0x42ac6e, name: 'y' },
    { dir: new THREE.Vector3(0,0,1), color: 0x215db2, name: 'z' }
  ];
  const length = 1.5;
  const headLength = 0.35 * 0.5;
  const headWidth = 0.18 *    0.5;
  const lineThickness = 0.035;

  // Get rotation from first selected object
  const objectRotation = selectedShapes[0].quaternion.clone();
  moveGizmo.quaternion.copy(objectRotation);

  axes.forEach(axis => {
    const axisGroup = new THREE.Group();
    
    // Create arrow in local space first



    // HEAD: use cube when SCALE mode is enabled, otherwise use cone (same approximate size)

    const headSize = headWidth * 1.6; // approximate visual size to match cone
    let headMesh;
    const headMat = new THREE.MeshBasicMaterial({
      color: axis.color,
      depthTest: false
    });

    if (scaleModeEnabled) {
      const boxGeom = new THREE.BoxGeometry(headSize, headSize, headSize);
      headMesh = new THREE.Mesh(boxGeom, headMat);
      headMesh.renderOrder = 999;
      // Place the cube so its near face sits at the gizmo end (approximate)
      if (axis.name === 'x') {
        headMesh.position.set(length - headSize / 2, 0, 0);
      } else if (axis.name === 'y') {
        headMesh.position.set(0, length - headSize / 2, 0);
      } else if (axis.name === 'z') {
        headMesh.position.set(0, 0, length - headSize / 2);
      }
    } else {
      const coneGeom = new THREE.ConeGeometry(headWidth, headLength, 24);
      headMesh = new THREE.Mesh(coneGeom, headMat);
      headMesh.renderOrder = 999;
      // Position cone at the end of axis in local space (original behavior)
      if (axis.name === 'x') {
        headMesh.position.set(length - headLength/2, 0, 0);
        headMesh.rotation.z = -Math.PI/2;
      } else if (axis.name === 'y') {
        headMesh.position.set(0, length - headLength/2, 0);
        headMesh.rotation.x = 0;
      } else if (axis.name === 'z') {
        headMesh.position.set(0, 0, length - headLength/2);
        headMesh.rotation.x = Math.PI/2;
      }
    }

    headMesh.userData.axis = axis.name;
    axisGroup.add(headMesh);
     moveGizmo.add(axisGroup);
   });

  // Place at center of selection
  let center = new THREE.Vector3();
  selectedShapes.forEach(g => center.add(g.position));
  center.divideScalar(selectedShapes.length);
  moveGizmo.position.copy(center);

  // Add view-facing ring
  if (moveGizmo.ring) {
    moveGizmo.remove(moveGizmo.ring);
    moveGizmo.ring = null;
  }

  const size = 512;
  const circleCanvas = document.createElement('canvas');
  circleCanvas.width = size;
  circleCanvas.height = size;
  const ctx = circleCanvas.getContext('2d');
  ctx.clearRect(0, 0, size, size);

  ctx.lineWidth = 64;
  ctx.strokeStyle = '#fff';
  ctx.beginPath();
  ctx.arc(size/2, size/2, size/2 - ctx.lineWidth/2, 0, Math.PI * 2);
  ctx.stroke();

  const texture = new THREE.CanvasTexture(circleCanvas);
  texture.anisotropy = renderer.capabilities.getMaxAnisotropy ? renderer.capabilities.getMaxAnisotropy() : 1;
  texture.needsUpdate = true;
  const material = new THREE.SpriteMaterial({

  moveGizmo.ring = sprite;

  scene.add(moveGizmo);
  updateMoveGizmoAxisVisibility();
}

function updateMoveGizmoAxisVisibility() {
  if (!moveGizmo) return;
  moveGizmo.children.forEach(child => {
    if (!child.children || !child.children[0]) return;
    const cone = child.children[0];
    const axis = cone.userData.axis;
    if (!axis) return;
    // Ensure gizmo axes remain visible even when global axis toggles are off.
    // Only hide the axis that matches the current ortho view to prevent overlap.
    if (
      (currentOrthoType === 'x' && axis === 'x') ||
      (currentOrthoType === 'y' && axis === 'y') ||
      (currentOrthoType === 'z' && axis === 'z')
    ) {

    } else {
      child.visible = true;
    }
  });
