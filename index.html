<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>3D Viewport with Correct Zoom & Undo/Redo</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #232323;
      font-family: Arial, sans-serif;
    }
    /* Move UI below the top bar */
    #ui {
      display: none;
    }

    /* Make canvas fit below the bar */
    #viewport {
      position: absolute;
      top: 75px;
      left: 45px;
      width: calc(100vw - 45px - 451px); /* <-- updated from 450px */
      height: calc(100vh - 75px - 75px);
      display: block;
      z-index: 1;
      background: #232323;
      border-radius: 0;
      outline: none; /* Remove default focus outline */
    }

    #viewport:focus {
      outline: none; /* Remove white line on click/focus */
    }

    button {
      /* If you want to keep button styles for view-menu, keep this block */
      margin: 5px;
      padding: 10px;
      font-size: 16px;
    }
    .axis-label {
      position: absolute;
      font-weight: bold;
      font-size: 26px; /* slightly bigger */
      pointer-events: none;
      user-select: none;
      text-transform: uppercase;
      font-family: Arial, sans-serif;
      /* force move 1px left */
      transform: translate(calc(-50% - 1px), -50%) !important;
      z-index: 20;
    }
    #label-x {
      color: #b24747; /* red */
    }
    #label-y {
      color: #42ac6e; /* green */
    }
    #label-z {
      color: #215db2; /* blue */
    }
    #view-menu {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      position: absolute;
      background: #232323;
      border: 2px solid #444;    /* was 1px */
      border-radius: 10px;
      z-index: 9999; /* Make sure it's above everything */
      /* box-shadow: 0 2px 8px #000a; */ /* <-- Remove or comment out this line */
      padding: 0 0 3px 0;   /* reduced bottom padding from 4px to 3px */
      margin: 0;
      min-width: 150px;
      width: 160px;
      overflow: hidden;
      pointer-events: auto;
    }
    #view-menu .view-menu-title {
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      padding: 10px 0 6px 0;
      letter-spacing: 2px;
      border-bottom: 2px solid #444; /* was 1px, now 3px for 2px thicker */
      background: #181818;
      width: 100%;
    }
    #view-menu .view-menu-title .view-menu-text {
      position: relative;
      top: -1px; /* Move the "VIEWS" title text 2 pixels more up (was 1px down, now 1px up) */
      left: -1px !important; /* force 1px left */
    }
    /* Center the hover background with the text */
    #view-menu button {
      display: block;
      width: 96%;
      margin: 3px auto 0 auto; /* center button horizontally */
      background: none;
      border: none;
      color: #fff;
      font-size: 16px;
      padding: 7px 0; /* remove left padding */
      text-align: center; /* center the text */
      cursor: pointer;
      transition: background 0.15s, border-radius 0.15s;
      border-radius: 8px;
      box-sizing: border-box;
      white-space: nowrap; /* Prevent line break */
    }
    #view-menu button:hover {
      background: #444;
    }

    .axis-label, #view-menu {
      display: none;
    }

    .view-menu-text {
      position: relative;
      top: 1px;
      left: -1px !important; /* force 1px left for all view menu text */
    }

    #box-select {
  position: fixed;
  border: 2px dashed #ff8000; /* changed from lime to orange to match selected outline */
  pointer-events: none;
  z-index: 200;
  background: rgba(255,128,0,0.08); /* changed from lime to a subtle orange */
}

/* Box select specifically for the Object Manager (drawn INSIDE the content) */
#object-manager-box-select {
  position: absolute;
  border: 2px dashed #ff8000;
  pointer-events: none;
  z-index: 3000;
  background: rgba(255,128,0,0.08);
  display: none;
} 

    /* Top bar styles */
    #top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 29.6px;
      background: #232323;
      z-index: 100001; /* raised so top-bar sits above everything */
      display: flex;
      align-items: flex-start;
      padding-left: 0;
      gap: 0;
    }

    .topbar-btn {
  background: #363636; /* darker than #444, lighter than #292929 */
  color: #fff;
  border: none;
  border-radius: 0;
  font-size: 13px;
  padding: 0 14px;
  height: 29.6px;
  margin: 0;
  cursor: pointer;
  transition: background 0.15s;
  z-index: 100002; /* above other overlays like side buttons and indicators */
  pointer-events: auto; /* ensure clicks are handled */
  box-sizing: border-box;
  line-height: 29.6px;
  text-transform: uppercase;
  font-weight: bold;
}
    .topbar-btn:hover {
      background: #444;
    }
    .topbar-btn:focus {
  outline: none;
}

/* new: file dropdown styling */
#file-dropdown {
  position: fixed;
  display: none;
  z-index: 100003; /* ensure dropdown is above everything */
  pointer-events: none;
  padding: 0;               /* remove any container padding */
  opacity: 0;               /* start hidden for animation */
  transform-origin: top center;
  transform: translateY(-8px) scaleY(0.985);
  transition: opacity 160ms ease, transform 160ms cubic-bezier(.2,.9,.3,1);
  will-change: opacity, transform;
}
#file-dropdown.visible {
  opacity: 1;
  transform: translateY(0) scaleY(1);
  pointer-events: auto;
}
#file-dropdown .topbar-btn {
  display: block;
  margin: 0;                /* no gaps between buttons */
  width: 100%;              /* width will be set dynamically to match File button */
  height: 29.6px;           /* same height as top-bar buttons */
  border-radius: 0;
  text-align: center;       /* <-- CENTER TEXT */
  padding: 0;               /* remove left/right padding so centering is exact */
  box-sizing: border-box;
  line-height: 29.6px;      /* vertically center text */
  background: #363636;      /* match topbar buttons */
  color: #fff;
  border: none;
}
/* keep hover look consistent */
#file-dropdown .topbar-btn:hover { background: #444 !important; }

/* NEW: Export button only rounded on bottom-right */
#file-export-btn {
  border-radius: 0 0 8px 0 !important;
}

    #top-bar .topbar-btn:last-child {
  border-radius: 0 8px 8px 0;
}

    #left-bar {
      position: fixed;
      top: 48px;
      left: 0;
      width: 45px;
      height: calc(100vh - 48px - 54px);
      background: #232323;
      z-index: 200; /* Must be higher than .axis-label (which is 20) */
      /* box-shadow: 2px 0 8px #000a; */ /* <-- Remove or comment out this line */
    }

    #right-bar {
      position: fixed;
      top: 48px;
      right: 0;
      width: 451px;
      height: calc(100vh - 48px - 54px);
      background: #232323;
      z-index: 201;
      /* box-shadow: -2px 0 8px #000a; */ /* <-- Remove or comment out this line */
    }

    /* Global rectangle on the right (same color, outlined) */
    #global-right-rect {
      position: fixed;
      right: 20px;
      top: 75px; /* align with viewport top */
      width: 411px; /* 451px bar width - 40px total side margins */
      /* Make the rectangle half of the viewport height and extend downward */
      height: 50vh;
      background: #232323; /* same as the bar */
      border: 2px solid #555555; /* outline color requested */
      box-sizing: border-box;
      border-radius: 0; /* sharp corners */
      z-index: 2147483647; /* highest possible to ensure it's above everything */
      pointer-events: auto; /* accept pointer events so children receive accurate events */
    }

    /* Title inside the right-side rectangle for quick discovery */
    /* Title inside the right-side rectangle for quick discovery */
    #global-right-rect .object-manager-title {
      position: absolute;
      top: 10px;
      left: 0; /* extend to the left edge of the object manager */
      right: 0; /* extend to the right edge of the object manager */
      color: #ffffff;
      font-weight: bold;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-family: Arial, sans-serif;
      pointer-events: none;
      user-select: none;
      z-index: 2147483648;
      padding-bottom: 7px; /* small gap so the line sits just under the text (moved 1px down) */
      padding-left: 14px; /* keep text inset while line spans full width */
      padding-right: 14px;
      box-sizing: border-box;
      border-bottom: 2px solid #555555; /* same color as the outline */
    }

    /* Force the visible title text position using relative offsets */
    #global-right-rect .object-manager-title .object-manager-text {
      display: inline-block;
      position: relative !important;
      left: -3px !important;    /* force 2px left */
      top: -1.5px !important;   /* force 1.5px up */
      transform: none !important;
      -webkit-transform: none !important;
    }

    /* Move the visible title text up slightly without moving the underline */
    #global-right-rect .object-manager-title .object-manager-text {
      display: inline-block;
      transform: translateY(-1.5px);
      -webkit-transform: translateY(-1.5px);
    }

    /* Object manager inner area (pannable/zoomable) */
    .object-manager-content {
      position: absolute;
      /* allow the content to extend all the way to the rectangle edges
         so the outer border (on #global-right-rect) visually overlays and
         hides node content seamlessly (no premature clipping). Keep the
         original top offset so the title area is preserved. */
      top: 36px;
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
      /* keep solid background color here; grid lives on the transformed
        nodes layer so it moves and scales with pan/zoom */
      background-color: #232323;
      touch-action: none; /* we'll handle pan/zoom */
      z-index: 1;
    }
    .object-manager-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; /* interactions happen on ports/nodes */
      /* Place wires above nodes so they are always visible */
      z-index: 2147483647;
    }
    .object-manager-canvas {
      position: absolute;
      top: 0;
      left: 0;
      transform-origin: 0 0;
      z-index: 2;
    }
    .nodes-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 10000px; /* large virtual canvas so grid appears endless */
      height: 10000px;
      z-index: 2;
      pointer-events: auto;
    }

    /* Large pseudo-element grid that extends far beyond the top/left so
       the grid appears endless while keeping nodes and interaction unchanged */
    .nodes-layer::before {
      content: '';
      position: absolute;
      top: -10000px;
      left: -10000px;
      width: 30000px;
      height: 30000px;
      pointer-events: none;
      z-index: 0;
      background-image: linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px, 40px 40px;
    }
    .object-node {
      position: absolute;
      width: 160px; /* match view menu width */
      height: 64px; /* reduced height */
      background: #232323; /* same as view/menu */
      border: 2px solid #444; /* same border as view-menu */
      color: #fff;
      padding: 6px 10px;
      border-radius: 10px; /* match view-menu */
      cursor: grab;
      user-select: none;
      z-index: 3;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
    }
    /* Selected node style: orange outline replaces the default gray */
    .object-node.selected { border-color: #ff8000; }
    /* HIDE node selected style: red outline */
    .object-node.hide-selected { border-color: #ff4d4d; }
    .object-node:active { cursor: grabbing; }
    .object-node-header { position: relative; display:flex; align-items:center; justify-content:space-between; }
    .object-node-title { font-weight: bold; font-size: 13px; color: #ccc; text-transform:uppercase; letter-spacing:1px; text-align:right; margin-right:6px; }
    .object-node-type { font-weight: bold; font-size: 16px; text-transform: uppercase; letter-spacing: 2px; color: #fff; }
    .object-node-port { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #0072cf; right: -7px; top: 50%; transform: translateY(-50%); cursor: crosshair; box-shadow: none; border: 2px solid #444; z-index:4; }
    .object-node-port.parent-port { background: #ff4d4d; right: -20px; top: -10px; transform: none; border: 2px solid #444; }
    .object-node-port.bottom-port { position: absolute; width: 14px; height: 14px; border-radius: 50%; bottom: -10px; left: 50%; transform: translateX(-50%); cursor: crosshair; box-shadow: none; border: 2px solid #444; background: #0072cf; pointer-events: auto; z-index:4; }
    .parent-port-label { position: absolute; right: 12px; top: 24.5px; transform: none; font-size: 10px; color: #ccc; text-transform: uppercase; letter-spacing: 1px; pointer-events: none; white-space: nowrap; }

    .object-node-port.connecting { box-shadow: none; border-color: #ffae5a; }
    /* Visibility node specific */
    .visibility-node { background: #181818; border: 2px solid #444; }
    /* make visibility node narrower and center its type text (slightly higher) */
    .visibility-node { width: 140px !important; position: relative; padding-top: 4px; text-align: center; }
    .visibility-node .object-node-type {
      position: relative; /* allow shifting */
      left: 12px; /* move HIDE text to the right */
      display: block;
      margin: 0 auto 0 auto;
      font-weight: bold;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #fff;
      text-align: center;
      line-height: 1;
      pointer-events: none;
      white-space: nowrap;
    }
    /* bottom ports for visibility node */
    .visibility-port { position: absolute; width: 14px; height: 14px; border-radius: 50%; bottom: -10px; transform: translateX(-50%); border: 2px solid #444; pointer-events: auto; z-index: 5; box-shadow: none; }
    .visibility-port.blue { background: #0072cf; left: 26%; }
    .visibility-port.red { background: #ff4d4d; left: 74%; }
    .visibility-port-label { position: absolute; bottom: 14px; transform: translateX(-50%); font-size: 10px; color: #ccc; text-transform: uppercase; letter-spacing: 1px; pointer-events: none; white-space: nowrap; }
    .visibility-port-label.blue { left: 26%; }
    .visibility-port-label.red { left: 74%; }
    /* Note: visibility ports/labels removed so the Visibility Node has no ports */
    .visibility-node .object-node-title { display: none; }

    #bottom-bar {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100vw;
      height: 75px;
      background: #232323;
      z-index: 200; /* Must be higher than .axis-label (which is 20) */
      /* box-shadow: 0 -2px 8px #000a; */ /* <-- Remove or comment out this line */
    }

    #frame-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #232323;
      z-index: 1000;
      pointer-events: none;
      /* The hole matches the viewport area */
      clip-path: polygon(
        0 0, 100vw 0, 100vw 75px, 45px 75px, 45px calc(100vh - 75px), 100vw calc(100vh - 75px), 100vw 100vh, 0 100vh, 0 calc(100vh - 75px), 0 75px, 45px 75px, 45px 0
      );
      box-shadow: 0 2px 8px #000a, 2px 0 8px #000a, -2px 0 8px #000a, 0 -2px 8px #000a;
    }

    #viewport-outline {
      position: absolute;
      top: 75px;
      left: 45px;
      width: calc(100vw - 45px - 451px); /* <-- updated from 450px */
      height: calc(100vh - 75px - 75px);
      pointer-events: none;
      z-index: 99; /* Below the view menu */
      box-sizing: border-box;
      border: 2px solid #555; /* Slightly brighter gray */
      border-radius: 0;
      background: none;
    }

    .topbar-btn-text {
  display: inline-block;
  /* Remove top: 1px; */
  transform: translateY(1px);
  line-height: normal;
}
#view-indicator {
  position: absolute;
  top: 80px;
  left: 52px !important; /* was 55px; forced 1px left */
  color: #fff;
  font-size: 15px;
  font-family: Arial, sans-serif;
  font-weight: bold;
  letter-spacing: 2px;
  text-transform: uppercase;
  z-index: 1002;
  pointer-events: none;
  user-select: none;
}
.side-btn {
  width: 37px;
  height: 37px;
  margin: 8px auto 0 auto;
  display: block;
  background: #363636; /* darker than #444, lighter than #292929 */
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 18px;
  font-family: inherit;
  font-weight: bold;
  cursor: pointer;
  transition: background 0.15s;
  box-sizing: border-box;
  text-align: center;

  padding: 0;
}
.side-btn:hover {
  background: #444; /* slightly lighter on hover */
}

.side-btn:focus {
  outline: none;
  box-shadow: none;
}

.side-btn-icon {
  width: 25px;
  height: 25px;
  display: block;
  margin: 0 auto;
}
.move-gizmo-icon {
  width: 31px;
  height: 31px;
  display: block;
  margin: 0 auto;
}
#box-selection-blocker-block:focus {
  outline: none;
  box-shadow: none;
}
#box-selection-blocker-block {
  transition: background 0.15s;
}
/* ON: hover is lighter blue */
#box-selection-blocker-block[style*="#0072cf"]:hover,
#box-selection-blocker-block[style*="rgb(0, 114, 207)"]:hover {
  background: #2196f3 !important;
}
/* OFF: hover is gray */
#box-selection-blocker-block:hover {
  background: #444 !important;
}
#move-gizmo-btn:focus {
  outline: none;
  box-shadow: none;
}
#move-gizmo-btn {
  transition: background 0.15s;
}
/* ON: hover is lighter blue */
#move-gizmo-btn[style*="#0072cf"]:hover,
#move-gizmo-btn[style*="rgb(0, 114, 207)"]:hover {
  background: #2196f3 !important;
}
/* OFF: hover is gray */
#move-gizmo-btn:hover {
  background: #444 !important;
}

#export-menu {
  display: none;
  flex-direction: column;
  align-items: flex-start;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: #232323;
  border: 2px solid #444;

  z-index: 9999;
  padding: 0 0 3px 0;
  margin: 0;

#export-menu .export-menu-title {
  text-align: center;
  font-size: 22px;
  font-weight: bold;
  color: #fff;
  padding: 15px 0 10px 0;

  border-bottom: 2px solid #444;

}
#export-menu button {
  display: block;

  font-size: 18px;

#export-menu button:hover {

}
#export-menu button.format-selected {

#export-menu .button-group {
  display: flex;

  margin: 15px auto 5px auto;
}
#export-menu .button-group button {
  flex: 1;
  margin: 0;
}
  </style>
</head>
<body>
  <canvas id="viewport"></canvas>
<div id="view-indicator">NORMAL VIEW</div>

  <!-- Axis labels -->
  <div id="label-x" class="axis-label">X</div>
  <div id="label-y" class="axis-label">Y</div>

  <img src="https://i.ibb.co/DggnJ354/Box-selection-lock-button.png" alt="Box selection" class="side-btn-icon">
</button>
<!-- Separator rectangle between box-selection-blocker-block and move-gizmo-btn -->

  <img src="https://i.ibb.co/fGK1mmXV/Box-selection-lock-button-02.png" alt="Move gizmo" class="side-btn-icon move-gizmo-icon">
</button>
<button class="side-btn" id="side-o-btn" style="position:fixed; top:155px; left:4px; z-index:3000;">
  <img src="https://i.ibb.co/G4M16tGs/Artboard-1-2.png" alt="Rotate gizmo" class="side-btn-icon move-gizmo-icon">
</button>
<button class="side-btn" id="side-c-btn" style="position:fixed; top:196px; left:4px; z-index:3000;">

// Helper: deep clone a THREE.Group shape
function cloneShapeGroup(group) {
  const clone = group.clone(true);
  clone.traverse(obj => {
    if (obj.isMesh && obj.geometry) obj.geometry = obj.geometry.clone();
    if (obj.isMesh && obj.material) obj.material = obj.material.clone();
    if (obj.isLineSegments && obj.geometry) obj.geometry = obj.geometry.clone();
    if (obj.isLineSegments && obj.material) obj.material = obj.material.clone();
  });
  return clone;
}

// First, let's define action types in a more comprehensive way
const ActionType = {
  ADD: 'add',
  REMOVE: 'remove',
  MOVE: 'move',
  ADD_MULTI: 'add-multi',
  REMOVE_MULTI: 'remove-multi',
  ROTATE: 'rotate',  // Add this line
  SCALE: 'scale',     // <-- NEW: scale action type
  CONNECT_VISIBILITY: 'connect-visibility',
  DISCONNECT_VISIBILITY: 'disconnect-visibility'
};

// Replace the existing undo function
function undo() {
  if (undoStack.length === 0) return;

  const action = undoStack.pop();
  
  switch(action.type) {
    case ActionType.ADD:
    case ActionType.ADD_MULTI:
      // Remove added shapes
      const shapesToRemove = Array.isArray(action.shapes) ? action.shapes : [action.shape];
      shapesToRemove.forEach(shape => {
        scene.remove(shape);
        const index = shapes.indexOf(shape);
        if (index > -1) shapes.splice(index, 1);
      });
      deselect();
      redoStack.push(action);
      break;

    case ActionType.REMOVE:
    case ActionType.REMOVE_MULTI:
      // Restore removed shapes
      const shapesToRestore = Array.isArray(action.shapes) ? action.shapes : [action.shape];
      shapesToRestore.forEach(shape => {
        scene.add(shape);
        shapes.push(shape);
      });
      redoStack.push(action);
      break;

    case ActionType.MOVE:
      // Restore previous positions
      action.shapes.forEach((shape, i) => {
        shape.position.copy(action.oldPositions[i]);
      });
      if (moveGizmo) {
        let center = new THREE.Vector3();
        action.shapes.forEach(g => center.add(g.position));
        center.divideScalar(action.shapes.length);
        moveGizmo.position.copy(center);
      }
      redoStack.push(action);
      break;

    case ActionType.CONNECT_VISIBILITY:
      // Undo a visibility connection by removing it (if present)
      {
        const idx = connections.findIndex(c => c.parentId === action.parentId && c.childId === action.childId && c.portType === action.portType);
        if (idx !== -1) {
          const c = connections[idx];
          // remove line and gradient
          if (c.line && c.line.parentNode) {
            const gid = c.line.dataset && c.line.dataset.gradId;
            if (gid) {
              const g = svg.querySelector('#' + gid);
              if (g && g.parentNode) g.parentNode.removeChild(g);
            }
            c.line.parentNode.removeChild(c.line);
          }
          // clear flags on child
          const child = nodesMap[c.childId];
          if (child && child.userData) {
            if (c.parentId === VIS_ID && c.portType) {
              if (child.userData.visibility) delete child.userData.visibility[c.portType];
            } else {
              delete child.userData.parentId;
            }
          }
          connections.splice(idx, 1);
          updateConnectionsFor(c.parentId);
          updateConnectionsFor(c.childId);
        }
        redoStack.push(action);
      }
      break;

    case ActionType.DISCONNECT_VISIBILITY:
      // Undo a disconnect by recreating the connection
      {
        const line = createSvgLine(0,0,0,0);
        svg.appendChild(line);
        // Use finalizeVisibilityOutputConnection in silent mode (don't record new undo action)
        finalizeVisibilityOutputConnection(action.parentId, action.childId, line, action.portType, false);
        redoStack.push(action);
      }
      break;

    case ActionType.SCALE:
      // Restore previous positions & scales
      action.shapes.forEach((shape, i) => {
        shape.position.copy(action.oldPositions[i]);
        shape.scale.copy(action.oldScales[i]);
      });
      if (moveGizmo) {
        let center = new THREE.Vector3();
        action.shapes.forEach(shape => center.add(shape.position));
        center.divideScalar(action.shapes.length);
        moveGizmo.position.copy(center);
      }
      redoStack.push(action);
      break;

    // When undoing a visibility disconnect we are recreating the connection; for redo we need to remove it again
    case ActionType.CONNECT_VISIBILITY:
      // Redo recreates the connection (do the same as user action)
      {
        const line = createSvgLine(0,0,0,0);
        svg.appendChild(line);
        // Use silent mode to avoid double-recording the action on the undo stack
        finalizeVisibilityOutputConnection(action.parentId, action.childId, line, action.portType, false);
        undoStack.push(action);
      }
      break;

    case ActionType.DISCONNECT_VISIBILITY:
      // Redo removes the connection (do the same as user action)
      {
        const idx = connections.findIndex(c => c.parentId === action.parentId && c.childId === action.childId && c.portType === action.portType);
        if (idx !== -1) {
          const c = connections[idx];
          if (c.line && c.line.parentNode) {
            const gid = c.line.dataset && c.line.dataset.gradId;
            if (gid) {
              const g = svg.querySelector('#' + gid);
              if (g && g.parentNode) g.parentNode.removeChild(g);
            }
            c.line.parentNode.removeChild(c.line);
          }
          const child = nodesMap[c.childId];
          if (child && child.userData) {
            if (c.parentId === VIS_ID && c.portType) {
              if (child.userData.visibility) delete child.userData.visibility[c.portType];
            } else {
              delete child.userData.parentId;
            }
          }
          connections.splice(idx, 1);
          updateConnectionsFor(c.parentId);
          updateConnectionsFor(c.childId);
        }
        undoStack.push(action);
      }
      break;

    case ActionType.ROTATE:
      // Restore previous rotations and positions
      action.shapes.forEach(({ shape, oldRotation, oldPosition }) => {
        shape.quaternion.copy(oldRotation);
        shape.position.copy(oldPosition);
      });
      // Update rotate gizmo if it exists
      if (rotateGizmo) {
        rotateGizmo.quaternion.copy(selectedShapes[0].quaternion);
        let center = new THREE.Vector3();
        selectedShapes.forEach(shape => center.add(shape.position));
        center.divideScalar(selectedShapes.length);
        rotateGizmo.position.copy(center);
      }
      redoStack.push(action);
      break;
  }
}

// Replace the existing redo function
function redo() {
  if (redoStack.length === 0) return;

  const action = redoStack.pop();

  switch(action.type) {
    case ActionType.ADD:
    case ActionType.ADD_MULTI:
      // Re-add the shapes
      const shapesToAdd = Array.isArray(action.shapes) ? action.shapes : [action.shape];
      shapesToAdd.forEach(shape => {
        scene.add(shape);
        shapes.push(shape);
      });
      deselect();
      shapesToAdd.forEach(shape => selectShape(shape, true));
      undoStack.push(action);
      break;

    case ActionType.REMOVE:
    case ActionType.REMOVE_MULTI:
      // Remove the shapes again
      const shapesToRemove = Array.isArray(action.shapes) ? action.shapes : [action.shape];
      shapesToRemove.forEach(shape => {
        scene.remove(shape);
        const index = shapes.indexOf(shape);
        if (index > -1) shapes.splice(index, 1);
      });
      deselect();
      undoStack.push(action);
      break;

    case ActionType.MOVE:
      // Restore newer positions
      action.shapes.forEach((shape, i) => {
        shape.position.copy(action.newPositions[i]);
      });
      if (moveGizmo) {
        let center = new THREE.Vector3();
        action.shapes.forEach(g => center.add(g.position));
        center.divideScalar(action.shapes.length);
        moveGizmo.position.copy(center);
      }
      undoStack.push(action);
      break;

    case ActionType.SCALE:
      // Restore newer positions & scales
      action.shapes.forEach((shape, i) => {
        shape.position.copy(action.newPositions[i]);
        shape.scale.copy(action.newScales[i]);
      });
      if (moveGizmo) {
        let center = new THREE.Vector3();
        action.shapes.forEach(shape => center.add(shape.position));
        center.divideScalar(action.shapes.length);
        moveGizmo.position.copy(center);
      }
      undoStack.push(action);
      break;

    case ActionType.ROTATE:
      // Restore newer rotations and positions
      action.shapes.forEach(({ shape, newRotation, newPosition }) => {
        shape.quaternion.copy(newRotation);
        shape.position.copy(newPosition);
      });
      // Update rotate gizmo if it exists

        selectedShapes.forEach(shape => center.add(shape.position));
        center.divideScalar(action.shapes.length);
        rotateGizmo.position.copy(center);
      }
      undoStack.push(action);
      break;
  }
}

function hideFileDropdown() {

function showFileDropdown(rect) {
  fileDropdown.style.width = rect.width + 'px';
  fileDropdown.style.left = rect.left + 'px';
  fileDropdown.style.top = (rect.bottom) + 'px'; // put dropdown directly under the File button (no gap)

  fileDropdown.style.display = 'block';

    fileDropdown.setAttribute('aria-hidden', 'false');
  });

      parameters: geom && geom.parameters ? geom.parameters : null,
      customGeometry: customGeometry,
      position: { x: group.position.x, y: group.position.y, z: group.position.z },
      quaternion: { x: group.quaternion.x, y: group.quaternion.y, z: group.quaternion.z, w: group.quaternion.w },
      scale: { x: group.scale.x, y: group.scale.y, z: group.scale.z },
      userData: group.userData || {}
    };
  });

  const cameraState = {
    usingOrtho: !!usingOrtho,
    currentOrthoType: currentOrthoType || null,
    // perspective camera snapshot
    persp: {
      position: (perspCamera && perspCamera.position) ? perspCamera.position.toArray() : camera.position.toArray(),
      target: target ? target.toArray() : [0,0,0]
    },
    ortho: orthoCamera ? {
      position: orthoCamera.position.toArray(),
      target: target ? target.toArray() : [0,0,0],
      zoom: orthoCamera.zoom
    } : null
  };

  const toolState = {
    moveGizmoEnabled: !!moveGizmoEnabled,
    rotateGizmoEnabled: !!rotateGizmoEnabled,
    scaleModeEnabled: !!scaleModeEnabled
  };

  const selectedIndices = selectedShapes.map(s => shapes.indexOf(s)).filter(i => i >= 0);

  return {
    version: 1,
    created: Date.now(),
    cameraState,
    toolState,
    shapes: shapesData,
    selectedIndices
  };
}

function downloadProjectFile(filename = 'project.p3ds', dataObj) {
  try {
    const json = JSON.stringify(dataObj, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  } catch(err) {
    console.error('Failed to prepare project file', err);
    alert('Save failed: ' + (err && err.message ? err.message : 'unknown error'));
  }
}

// Map geometry type -> spawn type used by spawnShape()
function geometryTypeToSpawnType(type, params) {
  if (type === 'BoxGeometry') return 'cube';
  if (type === 'SphereGeometry') return 'sphere';
  if (type === 'CylinderGeometry') return 'cylinder';
  if (type === 'ConeGeometry') {
    // pyramid was created as Cone with radialSegments = 4
    if (params && params.radialSegments === 4) return 'pyramid';
    return 'cone';
  }
  if (type === 'TorusGeometry') return 'torus';
  if (type === 'PlaneGeometry') return 'plane';
  // default fallback
  return 'cube';
}

// Create shapes from serialized data (not recording undo actions)
function createShapeFromData(sdata) {

  // --- Handle embedded custom geometry (imported models) ---
  if (sdata && sdata.customGeometry && Array.isArray(sdata.customGeometry)) {
    try {
      const floatArray = new Float32Array(sdata.customGeometry);
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(floatArray, 3));
      geo.computeVertexNormals();

      const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0x999999 }));
      const edges = new THREE.EdgesGeometry(geo);
      const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000 }));

      const group = new THREE.Group();
      group.add(mesh);
      group.add(line);

      if (sdata.position) group.position.set(sdata.position.x, sdata.position.y, sdata.position.z);
      if (sdata.quaternion) group.quaternion.set(sdata.quaternion.x, sdata.quaternion.y, sdata.quaternion.z, sdata.quaternion.w);
      if (sdata.scale) group.scale.set(sdata.scale.x, sdata.scale.y, sdata.scale.z);

      group.userData = sdata.userData || {};

      scene.add(group);
      shapes.push(group);
      return group;
    } catch (err) {
      console.warn('Failed to reconstruct custom geometry, falling back to primitive:', err);
    }
  }

  const type = geometryTypeToSpawnType(sdata.geometryType, sdata.parameters);
  // Build geometry based on parameters where possible
  let geo;
  const p = sdata.parameters || {};
  switch (type) {
    case 'cube': geo = new THREE.BoxGeometry(p.width || 1, p.height || 1, p.depth || 1); break;
    case 'sphere': geo = new THREE.SphereGeometry(p.radius || 0.5, p.widthSegments || 32, p.heightSegments || 32); break;
    case 'cylinder': geo = new THREE.CylinderGeometry(p.radiusTop || 0.5, p.radiusBottom || 0.5, p.height || 1, p.radialSegments || 32); break;
    case 'cone': geo = new THREE.ConeGeometry(p.radius || 0.5, p.height || 1, p.radialSegments || 32); break;
    case 'torus': geo = new THREE.TorusGeometry(p.radius || 0.5, p.tube || 0.18, p.radialSegments || 16, p.tubularSegments || 48); break;
    case 'plane': geo = new THREE.PlaneGeometry(p.width || 1, p.height || 1); break;
    case 'pyramid': geo = new THREE.ConeGeometry(p.radius || 0.7, p.height || 1, 4); break;
    default: geo = new THREE.BoxGeometry(1,1,1); break;
  }

  const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0x999999 }));
  const edges = new THREE.EdgesGeometry(geo);
  const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 3 }));
  const group = new THREE.Group();
  group.add(mesh);
  group.add(line);

  // Orientation fixes used by spawnShape
  if (type === 'torus') group.rotation.x = Math.PI / 2;
  if (type === 'plane') group.rotation.x = -Math.PI / 2;
  if (type === 'pyramid') group.rotation.y = Math.PI / 4;

  // Set transform & userdata
  if (sdata.position) group.position.set(sdata.position.x, sdata.position.y, sdata.position.z);
  if (sdata.quaternion) group.quaternion.set(sdata.quaternion.x, sdata.quaternion.y, sdata.quaternion.z, sdata.quaternion.w);
  if (sdata.scale) group.scale.set(sdata.scale.x, sdata.scale.y, sdata.scale.z);
  group.userData = sdata.userData || {};

  scene.add(group);
  shapes.push(group);
  return group;
}

function clearAllShapes() {
  // remove shapes from scene and clear arrays
  shapes.forEach(g => scene.remove(g));
  shapes.length = 0;
  selectedShapes.length = 0;
  selectedShape = null;
  // clear undo/redo
  undoStack.length = 0;
  redoStack.length = 0;
  updateMoveGizmoVisibility();
  updateRotateGizmoVisibility();
}

function restoreProject(data) {
  if (!data || !Array.isArray(data.shapes)) {
    alert('Invalid project file.');
    return;
  }

  // clear existing shapes
  clearAllShapes();

  // Recreate shapes
  data.shapes.forEach(s => createShapeFromData(s));

  // Restore camera
  try {
    if (data.cameraState && data.cameraState.usingOrtho) {
      // Ensure ortho camera exists
      if (!orthoCamera) {
        const { width, height } = getViewportSize();
        const aspect = width / height;
        const d = 3;
        orthoCamera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, -100, 100);
      }
      if (data.cameraState.ortho) {
        const o = data.cameraState.ortho;
        camera = orthoCamera;
        usingOrtho = true;
        lock2D = true;
        currentOrthoType = data.cameraState.currentOrthoType || null;
        orthoCamera.position.fromArray(o.position || [0,0,0]);
        if (o.zoom) orthoCamera.zoom = o.zoom;
        orthoCamera.updateProjectionMatrix();
        target.fromArray(o.target || [0,0,0]);
      } else {
        // fallback to perspective if ortho snapshot missing
        usingOrtho = false;
        camera = perspCamera;
        lock2D = false;
      }
    } else {
      // restore perspective
      usingOrtho = false;
      camera = perspCamera || camera;
      lock2D = false;
      if (data.cameraState && data.cameraState.persp) {
        const p = data.cameraState.persp;
        camera.position.fromArray(p.position || camera.position.toArray());
        target.fromArray(p.target || target.toArray());
        camera.lookAt(target);
      }
    }
  } catch (err) {
    console.warn('Failed to restore camera fully', err);
  }

  // Restore tools state
  if (data.toolState) {
    moveGizmoEnabled = !!data.toolState.moveGizmoEnabled;
    rotateGizmoEnabled = !!data.toolState.rotateGizmoEnabled;
    scaleModeEnabled = !!data.toolState.scaleModeEnabled;

    // Update button visuals
    updateMoveGizmoButton();
    const sideO = document.getElementById('side-o-btn');
    const sBtn = document.getElementById('side-c-btn');
    if (sideO) sideO.style.background = rotateGizmoEnabled ? '#0072cf' : '';
    if (sBtn) sBtn.style.background = scaleModeEnabled ? '#0072cf' : '';
    const moveBtn = document.getElementById('move-gizmo-btn');
    if (moveBtn) moveBtn.style.background = moveGizmoEnabled ? '#0072cf' : '';
  }

  // Restore selection
  deselect();
  if (Array.isArray(data.selectedIndices)) {
    data.selectedIndices.forEach(idx => {
      if (typeof idx === 'number' && shapes[idx]) selectShape(shapes[idx], true);
    });
    // If only one selected ensure selectedShape points at first
    if (selectedShapes.length > 0) selectedShape = selectedShapes[selectedShapes.length-1];
  }

  // Recreate gizmos for current tool visibility
  updateMoveGizmoVisibility();
  updateRotateGizmoVisibility();

  // Done
}

// Add this function to parse and import OBJ files
function importOBJ(objText) {
  const lines = objText.split('\n');
  const vertices = [];
  const faces = [];
  
  // Parse OBJ file
  lines.forEach(line => {
    line = line.trim();
    if (!line || line.startsWith('#')) return;
    
    const parts = line.split(/\s+/);
    const cmd = parts[0];
    
    if (cmd === 'v') {
      // Vertex position
      vertices.push(new THREE.Vector3(
        parseFloat(parts[1]) || 0,
        parseFloat(parts[2]) || 0,
        parseFloat(parts[3]) || 0
      ));
    } else if (cmd === 'f') {
      // Face (support triangles and quads)
      const indices = [];
      for (let i = 1; i < parts.length; i++) {
        const vertexData = parts[i].split('/');
        const vertexIndex = parseInt(vertexData[0]) - 1; // OBJ uses 1-based indexing
        if (vertexIndex >= 0 && vertexIndex < vertices.length) {
          indices.push(vertexIndex);
        }
      }
      // If quad, split into two triangles
      if (indices.length === 4) {
        faces.push([indices[0], indices[1], indices[2]]);
        faces.push([indices[0], indices[2], indices[3]]);
      } else if (indices.length === 3) {
        faces.push(indices);
      }
    }
  });
  
  if (vertices.length === 0) {
    alert('No vertices found in OBJ file');
    return;
  }
  
  // Create geometry from parsed data
  const geometry = new THREE.BufferGeometry();
  const positionArray = new Float32Array(faces.length * 3 * 3);
  
  let idx = 0;
  faces.forEach(face => {
    face.forEach(vertexIndex => {
      const v = vertices[vertexIndex];
      positionArray[idx++] = v.x;
      positionArray[idx++] = v.y;
      positionArray[idx++] = v.z;
    });
  });
  
  geometry.setAttribute('position', new THREE.BufferAttribute(positionArray, 3));
  geometry.computeVertexNormals();
  
  // Create mesh and group
  const mesh = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({ color: 0x999999 }));
  const edges = new THREE.EdgesGeometry(geometry);
  const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 3 }));
  
  const group = new THREE.Group();
  group.add(mesh);
  group.add(line);
  group.position.set(0, 0, 0);
  
  scene.add(group);
  shapes.push(group);
  
  // Record action for undo
  undoStack.push({ type: 'add', shape: group });
  redoStack.length = 0;
  
  // Select the imported model
  deselect();
  selectShape(group);
  
  alert(`OBJ imported successfully! (${vertices.length} vertices, ${faces.length} faces)`);
}

    resizeRendererAndCamera();

      requestAnimationFrame(animate);
      renderer.render(scene, camera);
      updateAxisLabels();

      // Make gizmo ring always face the camera
      if (moveGizmo && moveGizmo.ring) {
        moveGizmo.ring.quaternion.copy(camera.quaternion);
        // No scaling, just billboard
      }
    }

    // Axis labels in screen space
    const labelX = document.getElementById('label-x');
    const labelY = document.getElementById('label-y');
    const labelZ = document.getElementById('label-z');

    function updateAxisLabels() {
      // Project 3D positions to 2D screen space using canvas rect
      function projectToScreen(pos) {
        const vector = pos.clone();
        vector.project(camera);
        const rect = canvas.getBoundingClientRect();
        return {
          x: rect.left + (vector.x + 1) / 2 * rect.width,
          y: rect.top + (-vector.y + 1) / 2 * rect.height,
          inView: vector.x >= -1 && vector.x <= 1 && vector.y >= -1 && vector.y <= 1 && vector.z >= -1 && vector.z <= 1
        };
      }

      const offset = 0.05;
      const posX = projectToScreen(new THREE.Vector3(arrowLength + offset, 0, 0));
      const posY = projectToScreen(new THREE.Vector3(0, arrowLength + offset, 0));
      const posZ = projectToScreen(new THREE.Vector3(0, 0, arrowLength + offset));

      // Right bar position and margin for "underlap"
      const rightBarLeft = window.innerWidth - 420;
      const RIGHT_UNDERLAP = 20; // px, how much label can go under bar before hiding

      function showLabel(pos, label, orthoType) {
        label.style.left = pos.x + 'px';
        label.style.top = pos.y + 'px';
        // Allow label to go under right bar for RIGHT_UNDERLAP px before hiding
        const overlapsRightBar = pos.x > (rightBarLeft + RIGHT_UNDERLAP);
        label.style.display = (pos.inView && currentOrthoType !== orthoType && !overlapsRightBar) ? "block" : "none";
      }

      showLabel(posX, labelX, 'x');
      showLabel(posY, labelY, 'y');
      showLabel(posZ, labelZ, 'z');
    }

    // --- BOX SELECTION AND CLICK SELECTION LOGIC ---

    let boxSelecting = false;
    let boxSelectionJustFinished = false;
    let boxStart = { x: 0, y: 0 };
    let boxEnd = { x: 0, y: 0 };
    const boxDiv = document.getElementById('box-select');
    let mouseDownPos = null;
    let mouseMovedForBox = false;

    // Helper to get mouse position relative to canvas
    function getMousePosCanvas(e) {
      const rect = canvas.getBoundingClientRect();
      return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      };
    }

    // Mouse events for box selection and click selection
    window.addEventListener('mousedown', (e) => {
      // Only left mouse, not over UI, not menu, and NOT shift
      if (
        e.button !== 0 ||
        isOverUI(e) ||
        (menuActive && viewMenu.contains(e.target)) ||
        e.shiftKey ||
        !boxSelectionEnabled ||
        isMovingWithGizmo // <--- keep existing
      ) return;

      // Only start if mouse is over the canvas
      if (e.target !== canvas) return;

      mouseDownPos = getMousePosCanvas(e);
      mouseMovedForBox = false;
      boxSelecting = false;
      // Add these lines:
      boxStart = getMousePosCanvas(e);
      boxEnd = getMousePosCanvas(e);
    });

    window.addEventListener('mousemove', (e) => {
      lastMouse.x = e.clientX;
      lastMouse.y = e.clientY;
      lastMouseTarget = e.target;
 
      // --- Box selection logic ---
      if (
        boxSelectionEnabled &&
        mouseDownPos && e.buttons === 1 && e.target === canvas && !isOverUI(e) &&
        !isMovingWithGizmo && !isDraggingRotateGizmo // <-- NEW: don't box-select while rotating gizmo
      ) {
        const pos = getMousePosCanvas(e);
        if (!boxSelecting && (Math.abs(pos.x - mouseDownPos.x) > 4 || Math.abs(pos.y - mouseDownPos.y) > 4)) {
          boxSelecting = true;
          boxStart = mouseDownPos;
        }
        if (boxSelecting) {
          boxEnd = pos;
          updateBoxDiv();
          mouseMovedForBox = true;
        }
      }
    });

    window.addEventListener('mouseup', (e) => {
      if (!boxSelectionEnabled || isMovingWithGizmo) return; // <--- ADD isMovingWithGizmo

      if (boxSelecting) {
        boxSelecting = false;
        boxDiv.style.display = 'none';
        performBoxSelection();
        boxSelectionJustFinished = true;
        mouseDownPos = null;
        mouseMovedForBox = false;
        e.preventDefault();
        return;
      }
      // If mouse was pressed and released on canvas without dragging, treat as click
      if (
        mouseDownPos &&
        e.target === canvas &&
        !mouseMovedForBox &&
        !isOverUI(e)
      ) {
        // Simulate a click for selection
        onClick(e);
      }
      mouseDownPos = null;
      mouseMovedForBox = false;
    });

    // Update the visual selection rectangle
    function updateBoxDiv() {
      const minX = Math.min(boxStart.x, boxEnd.x);
      const minY = Math.min(boxStart.y, boxEnd.y);
      const maxX = Math.max(boxStart.x, boxEnd.x);
      const maxY = Math.max(boxStart.y, boxEnd.y);
      const rect = canvas.getBoundingClientRect();
      boxDiv.style.left = (rect.left + minX) + 'px';
      boxDiv.style.top = (rect.top + minY) + 'px';
      boxDiv.style.width = (maxX - minX) + 'px';
      boxDiv.style.height = (maxY - minY) + 'px';
      boxDiv.style.display = (maxX - minX > 4 && maxY - minY > 4) ? 'block' : 'none';
    }

    // Perform selection of shapes inside the box (by projecting their center)
    function performBoxSelection() {
      const rect = canvas.getBoundingClientRect();
      const minX = Math.min(boxStart.x, boxEnd.x) / rect.width * 2 - 1;
      const maxX = Math.max(boxStart.x, boxEnd.x) / rect.width * 2 - 1;
      const minY = -((Math.max(boxStart.y, boxEnd.y) / rect.height) * 2 - 1);
      const maxY = -((Math.min(boxStart.y, boxEnd.y) / rect.height) * 2 - 1);

      if (Math.abs(boxEnd.x - boxStart.x) < 4 || Math.abs(boxEnd.y - boxStart.y) < 4) return;

      deselect();

      console.log('Selection box NDC:', minX, maxX, minY, maxY);
      shapes.forEach(group => {
        group.updateMatrixWorld(true);
        const mesh = group.children[0];
        // Get geometry center in local space
        mesh.geometry.computeBoundingBox();
        const bbox = mesh.geometry.boundingBox;
        const center = bbox.getCenter(new THREE.Vector3());
        // Transform to world space
        mesh.localToWorld(center);
        center.project(camera);

        if (
          center.x >= minX && center.x <= maxX &&
          center.y >= minY && center.y <= maxY
        ) {
          selectShape(group, true);
        }
      });
    }

    function isOverUI(e) {
      // Check if mouse is over any UI element
      const uiIds = ['top-bar', 'ui', 'view-menu', 'box-select', 'shape-buttons'];
      let el = e.target;
      while (el) {
        if (el.id && uiIds.includes(el.id)) return true;
        if (el.classList && el.classList.contains('shape-btn')) return true;
        el = el.parentElement;
      }
      return false;
    }

    canvas.tabIndex = 1; // Make canvas focusable
    canvas.focus();      // Focus canvas on load
    canvas.addEventListener('mousedown', () => canvas.focus()); // Ensure canvas is focused on mousedown

// -------------------------
// Object Manager (nodes)
// -------------------------
const objectManager = (function() {
  const managerEl = document.getElementById('global-right-rect');
  const content = managerEl.querySelector('.object-manager-content');
  const svg = managerEl.querySelector('.object-manager-svg');
  const nodesLayer = managerEl.querySelector('.nodes-layer');
  const template = document.getElementById('object-node-template');
  const nodeBoxDiv = content.querySelector('#object-manager-box-select');

  // Node-area box selection state (for selecting nodes inside the object manager)
  let nodeBoxSelecting = false;
  let nodeBoxSelectionJustFinished = false;
  let nodeBoxStart = { x: 0, y: 0 };
  let nodeBoxEnd = { x: 0, y: 0 };
  let nodeMouseDownPos = null;
  let nodeMouseMovedForBox = false;
  // HIDE node selection state and helpers (select/deselect exposed via returned API)
  let visibilityNodeSelected = false;
  function selectVisibilityNode(additive = false) {
    const entry = nodesMap[VIS_ID];
    if (!entry || !entry.userData || !entry.userData.nodeEl) return;
    const nodeEl = entry.userData.nodeEl;
    if (!additive) {
      // clear other selections
      if (typeof deselect === 'function') deselect();
    }
    nodeEl.classList.add('hide-selected');
    visibilityNodeSelected = true;
  }
  function deselectVisibilityNode() {
    const entry = nodesMap[VIS_ID];
    if (!entry || !entry.userData || !entry.userData.nodeEl) return;
    entry.userData.nodeEl.classList.remove('hide-selected');
    visibilityNodeSelected = false;
  }
  // Helper: get mouse position relative to the object-manager content element
  function getMousePosContent(e) {
    const rect = content.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }
  // Helper: update the in-content box div positioning for content-area selection
  function updateBoxDivForContent() {
    if (!nodeBoxDiv) return;
    const minX = Math.min(nodeBoxStart.x, nodeBoxEnd.x);
    const maxX = Math.max(nodeBoxStart.x, nodeBoxEnd.x);
    const minY = Math.min(nodeBoxStart.y, nodeBoxEnd.y);
    const maxY = Math.max(nodeBoxStart.y, nodeBoxEnd.y);
    nodeBoxDiv.style.left = (minX) + 'px';
    nodeBoxDiv.style.top = (minY) + 'px';
    nodeBoxDiv.style.width = (maxX - minX) + 'px';
    nodeBoxDiv.style.height = (maxY - minY) + 'px';
    nodeBoxDiv.style.display = (maxX - minX > 4 && maxY - minY > 4) ? 'block' : 'none';
  }

  const nodesMap = {}; // id -> group
  const connections = []; // {parentId, childId, line}
  const VIS_ID = 'visibility-node';

  let pan = {x:0,y:0}, scale = 1;
  let isPanning = false, panStart = {x:0,y:0}, panOrigin = {x:0,y:0};

  function toLocal(clientX, clientY) {
    const rect = content.getBoundingClientRect();
    return { x: (clientX - rect.left - pan.x) / scale, y: (clientY - rect.top - pan.y) / scale };
  }

  // Convert viewport client coordinates to content-local (SVG) coordinates
  function clientToContentPoint(clientX, clientY) {
    const rect = content.getBoundingClientRect();
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function rgbToHex(rgb) {
    if (!rgb) return '#000000';
    if (rgb[0] === '#') return rgb;
    const m = rgb.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
    if (!m) return rgb;
    const r = parseInt(m[1]).toString(16).padStart(2, '0');
    const g = parseInt(m[2]).toString(16).padStart(2, '0');
    const b = parseInt(m[3]).toString(16).padStart(2, '0');
    return `#${r}${g}${b}`;
  }

  function setCanvasTransform() {
    const canvas = managerEl.querySelector('.object-manager-canvas');
    canvas.style.transform = `translate(${pan.x}px, ${pan.y}px) scale(${scale})`;
    // Recalculate connection lines to account for the new transform
    updateAllLines();
    // Also update any currently dragging connection so it stays in sync
    if (connecting && connecting.line && connecting.sourceId && (connecting.lastLocal || connecting.lastClient)) {
      const source = nodesMap[connecting.sourceId];
      if (source && source.userData && source.userData.nodeEl) {
        const nodeEl = source.userData.nodeEl;
        // Compute start in screen coordinates using DOM bounding boxes so
        // transforms (scale/pan) won't desync endpoints.
        const contentRect = content.getBoundingClientRect();
        let startScreen;
        if (connecting.isVisibility && connecting.portType) {
          const portEl = nodeEl.querySelector('.visibility-port' + (connecting.portType === 'viewport' ? '.blue' : '.red'));
          if (portEl) {
            const r = portEl.getBoundingClientRect();
            startScreen = { x: r.left + r.width / 2 - contentRect.left, y: r.top + r.height / 2 - contentRect.top };
          } else {
            // fallback to node-derived position
            const pos = { x: parseFloat(nodeEl.style.left || 0), y: parseFloat(nodeEl.style.top || 0) };
            const fraction = (connecting.portType === 'viewport') ? 0.34 : 0.66;
            const startLocal = { x: pos.x + Math.round(nodeEl.offsetWidth * fraction), y: pos.y + nodeEl.offsetHeight + 6 };
            startScreen = { x: startLocal.x * scale + pan.x, y: startLocal.y * scale + pan.y };
          }
        } else {
          const portEl = nodeEl.querySelector('.parent-port');
          if (portEl) {
            const r = portEl.getBoundingClientRect();
            startScreen = { x: r.left + r.width / 2 - contentRect.left, y: r.top + r.height / 2 - contentRect.top };
          } else {
            const startLocal = portCenter(nodeEl, nodeEl.querySelector('.parent-port'));
            startScreen = { x: startLocal.x * scale + pan.x, y: startLocal.y * scale + pan.y };
          }
        }
        // Prefer lastClient (actual pointer client coords) if available
        const pScreen = connecting.lastClient ? clientToContentPoint(connecting.lastClient.x, connecting.lastClient.y) : (connecting.lastLocal ? { x: connecting.lastLocal.x * scale + pan.x, y: connecting.lastLocal.y * scale + pan.y } : startScreen);
        updatePathEndpoints(connecting.line, startScreen.x, startScreen.y, pScreen.x, pScreen.y);

  }

  // Create a visual node for a THREE.Group
  function createNodeForGroup(group) {
    const id = group.uuid;
    const node = template.content.firstElementChild.cloneNode(true);
    node.dataset.id = id;
    // Set type label (CUBE, SPHERE, etc.) and name
    const typeLabel = getTypeLabel(group);
    const title = group.userData.name || typeLabel || (group.type || 'Object');
    node.querySelector('.object-node-type').textContent = typeLabel;
    // lower label is always 'PARENT' and should be near the port
    // hide the small lower title (was 'PARENT') — not needed on spawned nodes
    node.querySelector('.object-node-title').textContent = '';
    nodesLayer.appendChild(node);

    // Position new node (simple stack layout)
    const n = nodesLayer.children.length;
    const x = 20 + (n - 1) * 22;
    const y = 20 + (n - 1) * 18;
    setNodePosition(node, x, y);

    group.userData.nodePos = {x, y};
    group.userData.nodeEl = node;
    nodesMap[id] = group;

    node.addEventListener('pointerdown', nodePointerDown);

    node.addEventListener('click', (e) => {

      } else {

    const pl = document.createElement('div'); pl.className = 'parent-port-label'; pl.textContent = 'HIDE';
    node.appendChild(pl);
    port.addEventListener('pointerdown', portPointerDown);

    node.style.height = node.offsetHeight + 'px';

  }

  // -------------------------
  // HIDE Node (special, cannot be deleted)
  // -------------------------
  function createVisibilityNode() {
    const id = VIS_ID;
    const node = template.content.firstElementChild.cloneNode(true);
    // don't add special visibility class so it uses the same visuals as object nodes
    node.dataset.id = id;
    node.querySelector('.object-node-type').textContent = 'HIDE';
    // clear any lower text
    node.querySelector('.object-node-title').textContent = '';

    // remove any leftover port element from the cloned template so we can add our own bottom ports
    const leftoverPort = node.querySelector('.object-node-port');
    if (leftoverPort && leftoverPort.parentElement) leftoverPort.parentElement.removeChild(leftoverPort);

    // insert and position (match object nodes look exactly)
    nodesLayer.appendChild(node);
    // force a wider width inline so it expands to the right side
    node.style.width = '140px';
    // position it near the right edge of the object manager content (16px inset)
    const contentEl = managerEl.querySelector('.object-manager-content');
    const rightX = Math.max(16, Math.round((contentEl.clientWidth || 300) - node.offsetWidth - 15));
    setNodePosition(node, rightX, 16);
    // ensure type label fits and force a left nudge via inline styles (stronger than stylesheet)
    const typeEl = node.querySelector('.object-node-type');
    if (typeEl) {
      typeEl.style.fontSize = '16px';
      typeEl.style.letterSpacing = '2px';
      typeEl.style.margin = '0';
      typeEl.style.pointerEvents = 'none';
      // nudge and lift the label: make it relative so we can offset it
      typeEl.style.position = 'relative';
      typeEl.style.left = '36px';
      typeEl.style.marginTop = '-16px'; // move label slightly higher
    }

    // store a lightweight entry in nodesMap (not a THREE.Group)
    nodesMap[id] = { uuid: id, userData: { nodeEl: node, isVisibility: true } };

      }
    });

    // add two colored bottom ports (blue and red)
    const b1 = document.createElement('div'); b1.className = 'visibility-port blue'; b1.dataset.port = 'viewport';
    const b2 = document.createElement('div'); b2.className = 'visibility-port red'; b2.dataset.port = 'render';

    node.appendChild(b1); node.appendChild(b2);

    for (let i = connections.length - 1; i >= 0; i--) {

        if (c.line && c.line.parentNode) {
          const gid = c.line.dataset && c.line.dataset.gradId;
          if (gid) {

            if (g && g.parentNode) g.parentNode.removeChild(g);

  }

  
  

  function getTypeLabel(group) {
    const mesh = group.children.find(c => c.isMesh);
    if (!mesh || !mesh.geometry) return 'OBJECT';
    const geom = mesh.geometry;
    const t = geom.type || '';
    if (t === 'BoxGeometry') return 'CUBE';
    if (t === 'SphereGeometry') return 'SPHERE';
    if (t === 'CylinderGeometry') return 'CYLINDER';
    if (t === 'ConeGeometry') {

      if (geom.parameters && geom.parameters.radialSegments === 4) return 'PYRAMID';
      return 'CONE';
    }
    if (t === 'TorusGeometry') return 'TORUS';
    if (t === 'PlaneGeometry') return 'PLANE';
    return t.replace('Geometry','').toUpperCase();
  }

  function setNodePosition(node, x, y) {
    node.style.left = x + 'px';
    node.style.top = y + 'px';
  }

  // Node drag
  let dragging = null;
  function nodePointerDown(e) {
    const node = e.currentTarget.closest('.object-node');
    e.stopPropagation();

    const id = node.dataset.id;

    function move(ev) {
      const dx = (ev.clientX - start.x) / scale;
      const dy = (ev.clientY - start.y) / scale;
      const nx = orig.x + dx;
      const ny = orig.y + dy;

  let connecting = null; // {sourceId, line}
  function portPointerDown(e) {

    const node = port.closest('.object-node');
    const sourceId = node.dataset.id;

    const startHex = rgbToHex(startColor);

    connecting = { sourceId, line, startClient: { x: e.clientX, y: e.clientY }, lastClient: null, originalConnectionIndex: existingIdx, originalRemoved: false };

    function move(ev) {

      // or fractional rounding won't desync the line during pan/zoom
      const contentRect = content.getBoundingClientRect();

        const dy = ev.clientY - connecting.startClient.y;

      if (visPort) {
        const portType = visPort.dataset.port || (visPort.classList.contains('blue') ? 'viewport' : 'render');
        // finalize object -> visibility connection
        finalizeVisibilityInputConnection(sourceId, visPort, connecting.line, portType);
        // remove any previous connection for this child
        const prevIdx = connections.findIndex(c => c.childId === sourceId && c.line !== connecting.line);
        if (prevIdx !== -1) detachConnectionByIndex(prevIdx);
      } else {
        const targetPort = el && el.closest && el.closest('.object-node-port');
        if (targetPort) {
          const targetNode = targetPort.closest('.object-node');
          const targetId = targetNode.dataset.id;
          if (targetId && targetId !== sourceId) {
            // finalize connection: parent = target, child = source
            finalizeConnection(targetId, sourceId, connecting.line);

            const prevIdx = connections.findIndex(c => c.childId === sourceId && c.line !== connecting.line);
            if (prevIdx !== -1) detachConnectionByIndex(prevIdx);

            if (connecting.line) {

              if (gid) {
                const g = svg.querySelector('#' + gid);
                if (g && g.parentNode) g.parentNode.removeChild(g);
              }
              svg.removeChild(connecting.line);
            }
          }
        } else {
          // Released away from any target: treat as disconnect (remove previous connection)
          const prevIdx = connections.findIndex(c => c.childId === sourceId);
          if (prevIdx !== -1) detachConnectionByIndex(prevIdx);
          if (connecting.line) {
            const gid = connecting.line.dataset && connecting.line.dataset.gradId;
            if (gid) {
              const g = svg.querySelector('#' + gid);
              if (g && g.parentNode) g.parentNode.removeChild(g);
            }

          }
        }

    }

    document.addEventListener('pointerup', up);
  }

  // Visibility node bottom port drag handler
  function visibilityBottomPointerDown(e) {
    e.stopPropagation();

    const prevIdx = connections.findIndex(c => c.parentId === VIS_ID && c.portType === portType);

      connections.splice(prevIdx, 1);

        if (targetId && targetId !== sourceId) {
          finalizeVisibilityOutputConnection(sourceId, targetId, connecting.line, portType);
        } else {
          // released over same node: if we detached an existing connection earlier,
          // keep the original connection detached (user canceled), remove temp line
          if (connecting.line) {
            const gid = connecting.line.dataset && connecting.line.dataset.gradId;
            if (gid) {
              const g = svg.querySelector('#' + gid);
              if (g && g.parentNode) g.parentNode.removeChild(g);
            }
            if (connecting.line.parentNode) connecting.line.parentNode.removeChild(connecting.line);
          }
        }
      } else {
        // Released away from any target: remove the temporary line (disconnect)
        if (connecting.line) {
          const gid = connecting.line.dataset && connecting.line.dataset.gradId;
          if (gid) {
            const g = svg.querySelector('#' + gid);
            if (g && g.parentNode) g.parentNode.removeChild(g);
          }
          if (connecting.line.parentNode) connecting.line.parentNode.removeChild(connecting.line);
        }
      }

    }
    document.addEventListener('pointermove', move);
    document.addEventListener('pointerup', up);
  }

  function finalizeVisibilityOutputConnection(visibilityId, targetId, line, portType, recordAction = true) {
    // avoid duplicate connection
    if (connections.some(c => c.parentId === visibilityId && c.childId === targetId && c.portType === portType)) {
      if (line.parentNode) line.parentNode.removeChild(line);
      return;
    }
    const target = nodesMap[targetId];
    if (!target) { if (line.parentNode) line.parentNode.removeChild(line); return; }
    target.userData.visibility = target.userData.visibility || {};
    target.userData.visibility[portType] = true;
    // gradient: from visibility port color -> target's parent port color
    try {
      const visNodeEl = nodesMap[visibilityId].userData.nodeEl;
      const visPort = visNodeEl && visNodeEl.querySelector && visNodeEl.querySelector('.visibility-port' + (portType === 'viewport' ? '.blue' : '.red'));
      const tgtEl = target.userData.nodeEl;
      const tgtPort = tgtEl && tgtEl.querySelector && tgtEl.querySelector('.parent-port');
      const srcColor = visPort ? rgbToHex(window.getComputedStyle(visPort).backgroundColor) : (portType === 'viewport' ? '#0072cf' : '#ff4d4d');
      const tgtColor = tgtPort ? rgbToHex(window.getComputedStyle(tgtPort).backgroundColor) : '#0072cf';
      setPathGradientColors(line, srcColor, tgtColor);
    } catch (err) {}

    }
    const target = nodesMap[objectId];
    if (!target) { if (line.parentNode) line.parentNode.removeChild(line); return; }

  function portCenter(node, port) {

    const ns = 'http://www.w3.org/2000/svg';
    const defs = svg.querySelector('defs') || svg.insertBefore(document.createElementNS(ns, 'defs'), svg.firstChild);

    // helper: generate id
    const gid = 'grad-' + Math.random().toString(36).slice(2, 9);
    const grad = document.createElementNS(ns, 'linearGradient');
    grad.setAttribute('id', gid);
    grad.setAttribute('gradientUnits', 'userSpaceOnUse');
    // default stops (will be updated later)
    const s0 = document.createElementNS(ns, 'stop'); s0.setAttribute('offset', '0%'); s0.setAttribute('stop-color', '#ffae5a');
    const s1 = document.createElementNS(ns, 'stop'); s1.setAttribute('offset', '100%'); s1.setAttribute('stop-color', '#ffae5a');
    grad.appendChild(s0); grad.appendChild(s1);
    defs.appendChild(grad);

    const path = document.createElementNS(ns, 'path');
    path.setAttribute('stroke', `url(#${gid})`);
    path.setAttribute('stroke-width', '2');
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke-linecap', 'round');

    if (!path) return;

    const dx = x2 - x1;

    const sign = dx === 0 ? 1 : Math.sign(dx);
    const cpMag = Math.min(Math.abs(dx) * 0.45 + Math.abs(dy) * 0.05, 160);
    const cx1 = x1 + sign * cpMag;
    const cy1 = y1;
    const cx2 = x2 - sign * cpMag;
    const cy2 = y2;
    const d = `M ${x1} ${y1} C ${cx1} ${cy1} ${cx2} ${cy2} ${x2} ${y2}`;
    path.setAttribute('d', d);

    const gid = path.dataset.gradId;
    if (gid) {
      const grad = svg.querySelector('#' + gid);
      if (grad) {
        grad.setAttribute('x1', x1);

      const selBottom = crect.top + Math.max(nodeBoxStart.y, nodeBoxEnd.y);

      Object.keys(nodesMap).forEach(id => {

  // Allow drag when either Move OR Scale mode is active

  if (e.shiftKey) return;

  }
  const rect = canvas.getBoundingClientRect();
  const mouse = new THREE.Vector2(
    ((e.clientX - rect.left) / rect.width) * 2 - 1,
    -((e.clientY - rect.top) / rect.height) * 2 + 1
  );
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(mouse, camera);
  // Flatten all meshes in moveGizmo for raycasting
  const gizmoMeshes = [];
  moveGizmo.children.forEach(arrow => {
    arrow.traverse(obj => {
      if (obj.isMesh) gizmoMeshes.push(obj);
    });
  });
  const intersects = raycaster.intersectObjects(gizmoMeshes, false);
  if (intersects.length > 0) {
    draggingAxis = intersects[0].object.userData.axis;
    dragStartMouse = { x: e.clientX, y: e.clientY };
    dragStartPositions = selectedShapes.map(g => g.position.clone());
    // If scale mode, capture start scales & offsets
    if (scaleModeEnabled) {
      dragStartScales = selectedShapes.map(g => g.scale.clone());
      // compute center and per-shape offset from center
      dragStartCenter = new THREE.Vector3();
      selectedShapes.forEach(g => dragStartCenter.add(g.position));
      dragStartCenter.divideScalar(selectedShapes.length);
      dragStartOffsets = selectedShapes.map(g => g.position.clone().sub(dragStartCenter));
      // compute average half-extent along axis to derive scale factor reference
      const axisNormLocal = (draggingAxis === 'x') ? new THREE.Vector3(1,0,0) :
                            (draggingAxis === 'y') ? new THREE.Vector3(0,1,0) : new THREE.Vector3(0,0,1);
      axisNormLocal.applyQuaternion(moveGizmo.quaternion).normalize();
      let sumAbs = 0;
      dragStartOffsets.forEach(off => sumAbs += Math.abs(off.dot(axisNormLocal)));
      dragInitialHalfExtent = (sumAbs / Math.max(1, dragStartOffsets.length));
      if (dragInitialHalfExtent < 1e-4) dragInitialHalfExtent = 1; // fallback
    }
    isMovingWithGizmo = true;
    mouseDownPos = null;
    boxSelecting = false;
    mouseMovedForBox = false;

    // --- STORE AXIS ORIGIN AND DIRECTION IN WORLD SPACE ---
    gizmoAxisOrigin = moveGizmo.position.clone();
    gizmoAxisDir = new THREE.Vector3();
    if (draggingAxis === 'x') gizmoAxisDir.set(1, 0, 0);
   
    if (draggingAxis === 'y') gizmoAxisDir.set(0, 1, 0);
    if (draggingAxis === 'z') gizmoAxisDir.set(0, 0, 1);



    gizmoAxisDir.applyQuaternion(moveGizmo.quaternion);

    // --- FIND CLOSEST POINT ON AXIS TO MOUSE RAY (INITIAL GRAB POINT) ---
    const mouseRay = raycaster.ray;
    gizmoAxisStartPoint = closestPointOnAxisToRay(
      gizmoAxisOrigin,

      gizmoAxisDir,
      mouseRay.origin,
      mouseRay.direction
    );
    e.preventDefault();

    // --- SHOW MOVE INDICATOR BOX ---
    const moveIndicatorBox = document.getElementById('move-indicator-box');
    moveIndicatorBox.style.display = 'block';
    moveIndicatorBox.textContent = '0.00';
    // Position it at the gizmo origin (screen space)
    const screenPos = worldToScreen(moveGizmo.position, camera, canvas);
    moveIndicatorBox.style.left = (screenPos.x - moveIndicatorBox.offsetWidth / 2) + 'px';
    moveIndicatorBox.style.top = (screenPos.y - moveIndicatorBox.offsetHeight / 2) + 'px';
  }
});

// --- Drag logic for gizmo ---
window.addEventListener('mousemove', (e) => {
  // Allow drag processing when either Move OR Scale mode is active
  if (!moveGizmo || !draggingAxis || !(moveGizmoEnabled || scaleModeEnabled)) return;
  // --- Prevent drag if nothing is selected ---
  if (!selectedShapes || selectedShapes.length === 0) {
    const moveIndicatorBox = document.getElementById('move-indicator-box');
    if (moveIndicatorBox) moveIndicatorBox.style.display = 'none';
    return;
  }
  const rect = canvas.getBoundingClientRect();
  // Get axis direction in world space
  let axisDir = new THREE.Vector3();
  if (draggingAxis === 'x') axisDir.set(1, 0, 0);
  if (draggingAxis === 'y') axisDir.set(0, 1, 0);
  if (draggingAxis === 'z') axisDir.set(0, 0, 1);
  axisDir.applyQuaternion(moveGizmo.quaternion);

  // --- FIND NEW CLOSEST POINT ON AXIS TO MOUSE RAY ---
  const mouse = new THREE.Vector2(
    ((e.clientX - rect.left) / rect.width) * 2 - 1,
    -((e.clientY - rect.top) / rect.height) * 2 + 1
  );
  const raycaster = new THREE.Raycaster();
  raycaster.setFromCamera(mouse, camera);
  const mouseRay = raycaster.ray;
  const axisOrigin = moveGizmo.position.clone();
  const axisPointNow = closestPointOnAxisToRay(
    axisOrigin,
    axisDir,
    mouseRay.origin,
    mouseRay.direction
  );

  // --- COMPUTE MOVEMENT ALONG AXIS ---
  let moveAmount = 0;
  if (gizmoAxisStartPoint) {
    moveAmount = axisPointNow.clone().sub(gizmoAxisStartPoint).dot(axisDir.clone().normalize());
  }

  // --- SNAP LOGIC ---
  const snapActive = e.shiftKey;
  if (snapActive) {
    // Snap the moveAmount for both Move and Scale modes to 0.10 units
    const snapStep = 0.10;
    moveAmount = Math.round(moveAmount / snapStep) * snapStep;
  }

  if (scaleModeEnabled) {
    // SCALE MODE: scale selectedShapes along the dragged axis around selection center
    const axisNorm = axisDir.clone().normalize();
    // Compute scale factor relative to initial half-extent
    const factor = 1 + (moveAmount / Math.max(1e-4, dragInitialHalfExtent));
    const scaleFactor = Math.max(0, factor);
    selectedShapes.forEach((g, i) => {
      // start perpendicular + axis component separation
      const startOffset = dragStartOffsets[i].clone();
      const axisComp = axisNorm.clone().multiplyScalar(startOffset.dot(axisNorm));
      const perp = startOffset.clone().sub(axisComp);
      const newAxisComp = axisComp.clone().multiplyScalar(scaleFactor);
      const newOffset = perp.add(newAxisComp);
      g.position.copy(dragStartCenter.clone().add(newOffset));
      // scale only along the active axis
      const startScale = dragStartScales[i];
      if (draggingAxis === 'x') {
        g.scale.set(startScale.x * scaleFactor, startScale.y, startScale.z);
      } else if (draggingAxis === 'y') {
        g.scale.set(startScale.x, startScale.y * scaleFactor, startScale.z);
      } else {
        g.scale.set(startScale.x, startScale.y, startScale.z * scaleFactor);
      }
    });

    // Update gizmo position to selection center
    let center = new THREE.Vector3();
    selectedShapes.forEach(shape => center.add(shape.position));
    center.divideScalar(selectedShapes.length);
    moveGizmo.position.copy(center);

    // Update indicator box for scale (show multiplier)
    const moveIndicatorBox = document.getElementById('move-indicator-box');
    if (isMovingWithGizmo && moveIndicatorBox) {
      // show scale multiplier with two decimals
      moveIndicatorBox.textContent = scaleFactor.toFixed(2) + (snapActive ? ' (SNAP)' : '');
      moveIndicatorBox.style.borderColor = snapActive ? '#39ff14' : '#444';
      const screenPos = worldToScreen(moveGizmo.position, camera, canvas);
      moveIndicatorBox.style.left = (screenPos.x - moveIndicatorBox.offsetWidth / 2) + 'px';
      moveIndicatorBox.style.top = (screenPos.y - moveIndicatorBox.offsetHeight / 2) + 'px';
    }
  } else {
    // MOVE MODE: existing translation behavior
    selectedShapes.forEach((g, i) => {
      let pos = dragStartPositions[i].clone();
      pos.add(axisDir.clone().normalize().multiplyScalar(moveAmount));
      g.position.copy(pos);
    });

    // Move gizmo itself
    let center = new THREE.Vector3();
    selectedShapes.forEach(g => center.add(g.position));
    center.divideScalar(selectedShapes.length);
    moveGizmo.position.copy(center);

    // --- UPDATE MOVE INDICATOR BOX ---
    const moveIndicatorBox = document.getElementById('move-indicator-box');
    if (isMovingWithGizmo && moveIndicatorBox) {
      // Show absolute value, max 2. decimals, never negative
      moveIndicatorBox.textContent = Math.abs(moveAmount).toFixed(2) + (snapActive ? ' (SNAP)' : '');
      // Outline LIME when snap is active, otherwise default gray
      moveIndicatorBox.style.borderColor = snapActive ? '#39ff14' : '#444';
      // Position it at the gizmo origin (screen space)
      const screenPos = worldToScreen(moveGizmo.position, camera, canvas);
      moveIndicatorBox.style.left = (screenPos.x - moveIndicatorBox.offsetWidth / 2) + 'px';
      moveIndicatorBox.style.top = (screenPos.y - moveIndicatorBox.offsetHeight / 2) + 'px';
    }
  }
});

// --- Helper: Closest point on axis to ray ---
function closestPointOnAxisToRay(axisOrigin, axisDir, rayOrigin, rayDir) {
  // See: https://math.stackexchange.com/a/1036959
  const p1 = axisOrigin, d1 = axisDir.clone().normalize();
  const p2 = rayOrigin, d2 = rayDir.clone().normalize();
  const w0 = p1.clone().sub(p2);
  const a = d1.dot(d1);
  const b = d1.dot(d2);
  const c = d2.dot(d2);
  const d = d1.dot(w0);
  const e = d2.dot(w0);
  const denom = a * c - b * b;
  if (Math.abs(denom) < 1e-6) return p1.clone(); // Parallel, just return axis origin
  const t = (b * e - c * d) / denom;
  return p1.clone().add(d1.clone().multiplyScalar(t));
}

// --- Helper: Project world position to screen ---
function worldToScreen(pos, camera, canvas) {
  const vector = pos.clone().project(camera);
  const rect = canvas.getBoundingClientRect();
  return {
    x: rect.left + (vector.x + 1) / 2 * rect.width,
    y: rect.top + (-vector.y + 1) / 2 * rect.height
  };
}

     } else {

let rotateGizmo = null;
let rotateGizmoEnabled = false;
let draggingRotationAxis = null;
let rotationStartAngle = 0;
let rotationStartQuaternion = new THREE.Quaternion();

function createRotateGizmo() {
  if (rotateGizmo) {
    scene.remove(rotateGizmo);
  }
  if (!rotateGizmoEnabled || selectedShapes.length === 0) return;

  rotateGizmo = new THREE.Group();

  const radius = 1.2;
  const tubeWidth = 0.03;
  const segments = 64;

  // Store base radius so we can scale the gizmo to keep a constant screen size
  rotateGizmo.userData.baseRadius = radius;

  const axes = [
    { axis: 'x', color: 0xb24747 }, // red
    { axis: 'y', color: 0x42ac6e }, // green
    { axis: 'z', color: 0x215db2 }  // blue
  ];

  axes.forEach(({ axis, color }) => {
    const torusGeometry = new THREE.TorusGeometry(radius, tubeWidth, 16, segments);
    const material = new THREE.MeshBasicMaterial({ 
      color: color,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.85,
      depthTest: false     // Add this line
    });
    const ring = new THREE.Mesh(torusGeometry, material);
    ring.userData.axis = axis;
    ring.renderOrder = 999;  // Add this line

    // Set correct orientation for each axis
    if (axis === 'x') {
      ring.rotateY(Math.PI / 2);
    } else if (axis === 'y') {
      ring.rotateX(Math.PI / 2);
    }
    // Z axis is already correctly oriented

    rotateGizmo.add(ring);
  });
  
  // Position at selection center and match rotation
  let center = new THREE.Vector3();
  let combinedRotation = new THREE.Quaternion();
  
  selectedShapes.forEach((shape, index) => {
    center.add(shape.position);
    if (index === 0) {
      combinedRotation.copy(shape.quaternion);
    }
  });
  
  center.divideScalar(selectedShapes.length);
  rotateGizmo.position.copy(center);
  rotateGizmo.quaternion.copy(combinedRotation);

  scene.add(rotateGizmo);
  updateRotateGizmoAxisVisibility();
}

function updateRotateGizmoAxisVisibility() {
  if (!rotateGizmo) return;
  // In ortho views show only the ring that corresponds to the view axis (e.g. X view -> show X ring only).
  if (usingOrtho && currentOrthoType) {
    rotateGizmo.children.forEach(ring => {
      const axis = ring.userData.axis;
      ring.visible = (axis === currentOrthoType);
    });
  } else {
    // In perspective / normal view show all rings
    rotateGizmo.children.forEach(ring => {
      ring.visible = true;
    });
  }
}

function updateRotateGizmoVisibility() {
  if (rotateGizmo) scene.remove(rotateGizmo);
  if (rotateGizmoEnabled && selectedShapes.length > 0) {
    createRotateGizmo();
  }
}
